<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent — HQ Earth + Continuous Cloud Deck V24</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh;touch-action:pan-y}
#stage,#cloudFx{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none}
#stage{z-index:1;overflow:hidden;background:#020611}#stage canvas,#cloudFx{display:block;width:100%;height:100%}
#cloudFx{z-index:3;opacity:0;will-change:opacity}
</style>
</head>
<body><div id="stage"></div><canvas id="cloudFx"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const TOTAL=10.005,EARTH_END=2.12,CLOUD_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}const R=rng(24092026);
const desktop=innerWidth>=900;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.008,1400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
function setRendererQuality(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,desktop?2.0:1.28));renderer.setSize(innerWidth,innerHeight,false)}setRendererQuality();renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdce5eb,0x313941,.84));const sun=new THREE.DirectionalLight(0xfff8ed,3.75);sun.position.set(7,5,8);scene.add(sun);
const starN=desktop?3200:2200,sp=new Float32Array(starN*3);for(let i=0;i<starN;i++){const r=70+R()*150,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;sp[i*3]=r*Math.sin(th)*Math.cos(ph);sp[i*3+1]=r*Math.cos(th);sp[i*3+2]=r*Math.sin(th)*Math.sin(ph)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.17,color:0xcbd7e4,transparent:true,opacity:.82}));scene.add(stars);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');const threeBase='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthGroup=new THREE.Group();scene.add(earthGroup);const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:8,specular:0x223649,transparent:true});
const hqEarth='https://raw.githubusercontent.com/Shriisoot/Planets-texture/main/8k_earth_daymap.jpg',fallbackEarth=threeBase+'earth_atmos_2048.jpg';
function applyEarthTexture(t){t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;earthMat.map=t;earthMat.needsUpdate=true}
if(desktop)loader.load(hqEarth,applyEarthTexture,undefined,()=>loader.load(fallbackEarth,applyEarthTexture));else loader.load(fallbackEarth,applyEarthTexture);
loader.load(threeBase+'earth_normal_2048.jpg',t=>{t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());earthMat.normalMap=t;earthMat.normalScale.set(.38,.38);earthMat.needsUpdate=true});loader.load(threeBase+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,desktop?160:104,desktop?160:104),earthMat);earthGroup.add(earth);
const earthCloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.47,depthWrite:false,color:0xffffff});loader.load(threeBase+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());earthCloudMat.map=t;earthCloudMat.needsUpdate=true});const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.006,desktop?120:80,desktop?120:80),earthCloudMat);earthGroup.add(earthClouds);
const atmoU={uOpacity:{value:.205},uColor:{value:new THREE.Color(0x87bfe8)}};const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.024,desktop?120:80,desktop?120:80),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),5.8);gl_FragColor=vec4(uColor,rim*uOpacity);}`}));earthGroup.add(atmo);
const startQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(.25,-.02,-.035));function geoVec(lat,lon){const la=THREE.MathUtils.degToRad(lat),lo=THREE.MathUtils.degToRad(lon);return new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)).normalize()}
const gaza=geoVec(31.50,34.47),north=new THREE.Vector3(0,1,0),up=north.clone().sub(gaza.clone().multiplyScalar(north.dot(gaza))).normalize(),right=up.clone().cross(gaza).normalize();const basis=new THREE.Matrix4().makeBasis(right,up,gaza).transpose(),gazaQ=new THREE.Quaternion().setFromRotationMatrix(basis);
const earthKeys=[[0,4.18,47],[.76,4.18,47],[1.03,3.60,48],[1.32,2.82,50],[1.57,2.10,53.5],[1.80,1.53,58.5],[1.98,1.19,64.5],[2.12,1.025,69]];function earthSample(t){for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){const q=ease((t-a[0])/(b[0]-a[0]));return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}return{z:1.025,f:69}}
const fx=document.getElementById('cloudFx'),ctx=fx.getContext('2d',{alpha:true});let W=0,H=0,DPR=1;
function resizeFx(){DPR=Math.min(devicePixelRatio||1,desktop?1.55:1.16);W=innerWidth;H=innerHeight;fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);fx.style.width=W+'px';fx.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}resizeFx();
function makeDeck(seed,w=1800,h=1000){const rr=rng(seed),raw=document.createElement('canvas'),soft=document.createElement('canvas');raw.width=soft.width=w;raw.height=soft.height=h;const r=raw.getContext('2d'),s=soft.getContext('2d');r.clearRect(0,0,w,h);for(let i=0;i<420;i++){const px=rr()*w,py=h*(.15+rr()*.80),rx=26+rr()*100,ry=rx*(.42+rr()*.46),g=r.createRadialGradient(px-rx*.16,py-ry*.18,0,px,py,rx);g.addColorStop(0,`rgba(255,255,255,${.30+rr()*.18})`);g.addColorStop(.50,'rgba(248,251,252,.28)');g.addColorStop(.82,'rgba(224,232,236,.12)');g.addColorStop(1,'rgba(255,255,255,0)');r.save();r.translate(px,py);r.scale(1,ry/rx);r.translate(-px,-py);r.fillStyle=g;r.beginPath();r.arc(px,py,rx,0,Math.PI*2);r.fill();r.restore()}s.filter='blur(7px)';s.drawImage(raw,0,0);s.filter='none';s.globalCompositeOperation='source-atop';const shade=s.createLinearGradient(0,0,0,h);shade.addColorStop(0,'rgba(255,255,255,.18)');shade.addColorStop(.52,'rgba(205,216,223,.04)');shade.addColorStop(1,'rgba(102,116,125,.24)');s.fillStyle=shade;s.fillRect(0,0,w,h);s.globalCompositeOperation='source-over';return soft}
function makePuff(seed){const rr=rng(seed),n=520,c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=n;for(let i=0;i<74;i++){const a=rr()*Math.PI*2,rad=Math.pow(rr(),.75)*n*.19,px=n*.5+Math.cos(a)*rad,py=n*.50+Math.sin(a)*rad*.62,rx=n*(.045+rr()*.075),ry=rx*(.55+rr()*.38),g=x.createRadialGradient(px-rx*.14,py-ry*.18,0,px,py,rx);g.addColorStop(0,'rgba(255,255,255,.34)');g.addColorStop(.58,'rgba(245,249,250,.24)');g.addColorStop(1,'rgba(255,255,255,0)');x.save();x.translate(px,py);x.scale(1,ry/rx);x.translate(-px,-py);x.fillStyle=g;x.beginPath();x.arc(px,py,rx,0,Math.PI*2);x.fill();x.restore()}x.globalCompositeOperation='source-atop';const sh=x.createLinearGradient(0,n*.2,0,n*.85);sh.addColorStop(0,'rgba(255,255,255,.10)');sh.addColorStop(1,'rgba(105,120,128,.20)');x.fillStyle=sh;x.fillRect(0,0,n,n);x.globalCompositeOperation='source-over';return c}
const deckFar=makeDeck(2411),deckNear=makeDeck(2412),puffs=[makePuff(2421),makePuff(2422),makePuff(2423),makePuff(2424)];
function drawCloudDeck(t){ctx.clearRect(0,0,W,H);const q=seg(t,2.08,CLOUD_END);if(q<=0){fx.style.opacity='0';return}const fadeIn=ease(seg(t,2.08,2.26)),fadeOut=1-ease(seg(t,4.62,4.90));fx.style.opacity=String(fadeIn*fadeOut);const gray=ease(seg(q,.64,.96)),mix=(a,b,m)=>Math.round(lerp(a,b,m));const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,`rgb(${mix(8,132,gray)},${mix(43,145,gray)},${mix(92,149,gray)})`);sky.addColorStop(.44,`rgb(${mix(57,171,gray)},${mix(129,183,gray)},${mix(188,185,gray)})`);sky.addColorStop(1,`rgb(${mix(167,195,gray)},${mix(205,200,gray)},${mix(225,198,gray)})`);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 const top=ease(seg(q,0,.48)),enter=ease(seg(q,.48,.80)),inside=ease(seg(q,.68,.90));const horizon=H*(.24-.05*top);
 ctx.save();ctx.globalAlpha=.92*(1-.58*inside);const farScale=1.02+top*.42,farW=W*farScale,farH=H*(.42+top*.20),farX=(W-farW)/2,farY=horizon-H*.05-top*H*.09;ctx.drawImage(deckFar,farX,farY,farW,farH);ctx.restore();
 ctx.save();ctx.globalAlpha=.84*(.72+.28*top)*(1-.36*inside);const nearScale=1.18+top*.90,nearW=W*nearScale,nearH=H*(.46+top*.54),nearX=(W-nearW)/2,nearY=horizon+H*(.05-top*.13);ctx.drawImage(deckNear,nearX,nearY,nearW,nearH);ctx.restore();
 if(top>.18){ctx.save();ctx.globalAlpha=.34+.40*top;const s=Math.max(W,H)*(.28+.35*top);ctx.drawImage(puffs[0],-s*.36,H*.48-s*.12,s,s*.72);ctx.drawImage(puffs[1],W-s*.64,H*.44-s*.08,s,s*.72);ctx.drawImage(puffs[2],W*.18,H*.62-s*.22,s*.86,s*.62);ctx.restore()}
 if(enter>0){ctx.save();ctx.globalAlpha=.20+.28*enter;const s=Math.max(W,H)*(.44+.28*enter);ctx.drawImage(puffs[3],-s*.38,H*.10,s,s*.72);ctx.drawImage(puffs[2],W-s*.62,H*.18,s,s*.72);ctx.restore();const fog=ctx.createLinearGradient(0,0,0,H);fog.addColorStop(0,`rgba(226,234,238,${.05*enter})`);fog.addColorStop(.48,`rgba(218,226,230,${.18*enter})`);fog.addColorStop(1,`rgba(190,201,206,${.28*enter})`);ctx.fillStyle=fog;ctx.fillRect(0,0,W,H)}
 if(inside>.20){ctx.save();ctx.globalAlpha=.15*inside;ctx.fillStyle='#d8e0e2';ctx.fillRect(0,0,W,H);ctx.restore()}}
let smoothP=0,last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smoothP+=(target-smoothP)*(1-Math.exp(-8.5*dt));const t=smoothP*TOTAL;const ek=earthSample(Math.min(t,EARTH_END));camera.position.set(0,0.012,ek.z);camera.lookAt(0,0.015,0);camera.fov=ek.f;camera.updateProjectionMatrix();const rot=ease(seg(t,.02,.74));earthGroup.quaternion.copy(startQ).slerp(gazaQ,rot);earthClouds.rotation.y+=dt*.007;const ef=1-ease(seg(t,2.02,2.26));earthGroup.visible=ef>.003;stars.visible=ef>.003;earthMat.opacity=ef;earthCloudMat.opacity=.47*ef;atmoU.uOpacity.value=.205*ef;renderer.render(scene,camera);drawCloudDeck(t)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();setRendererQuality();resizeFx()});
</script></body></html>
