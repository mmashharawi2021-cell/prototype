<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atlas Descent 3D — Earth Match V12</title><style>html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh;touch-action:pan-y}#scene,#veil{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none}#scene{border:0;display:block;background:#020611;transform-origin:50% 50%;will-change:transform,filter}#veil{z-index:2;background:radial-gradient(circle at 50% 52%,rgba(221,232,238,.11),rgba(190,207,216,.035) 42%,transparent 72%);opacity:0;will-change:opacity}</style></head><body><iframe id="scene" src="./base-v11.html?v=12" title="Atlas Descent"></iframe><div id="veil"></div><script>const TOTAL=10.005,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);const f=document.getElementById('scene'),veil=document.getElementById('veil');let ready=false,last=-1,target=0;const keys=[[0,.855,.88,.955],[.5,.865,.89,.96],[1,.895,.91,.97],[1.25,.925,.93,.98],[1.5,.965,.96,.99],[1.75,.992,.985,1],[1.95,1,1,1],[2.12,1,1,1]];function sample(t){if(t<=keys[0][0])return keys[0];for(let i=1;i<keys.length;i++){const a=keys[i-1],b=keys[i];if(t<=b[0]){const q=ease(clamp((t-a[0])/(b[0]-a[0])));return[t,lerp(a[1],b[1],q),lerp(a[2],b[2],q),lerp(a[3],b[3],q)]}}return[t,1,1,1]}function progress(){const m=document.documentElement.scrollHeight-innerHeight;return m>0?clamp(scrollY/m):0}function update(){target=progress()}addEventListener('scroll',update,{passive:true});addEventListener('resize',update,{passive:true});f.addEventListener('load',()=>{ready=true;update()});update();function frame(){requestAnimationFrame(frame);const p=target,t=p*TOTAL,k=sample(Math.min(t,2.12));if(t<=2.12){f.style.transform=`scale(${k[1].toFixed(4)})`;f.style.filter=`saturate(${k[2].toFixed(3)}) brightness(${k[3].toFixed(3)}) contrast(.99)`}else{f.style.transform='scale(1)';f.style.filter='none'}const a=ease(clamp((t-2.02)/.12)),b=1-ease(clamp((t-2.16)/.18));veil.style.opacity=String((.10*a*b).toFixed(3));if(ready&&Math.abs(p-last)>.00001){try{const w=f.contentWindow,m=w.document.documentElement.scrollHeight-w.innerHeight;w.scrollTo(0,p*m);last=p}catch(e){}}}requestAnimationFrame(frame)</script></body></html>
