<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent — HQ Earth + Top Cloud Descent V23</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh;touch-action:pan-y}
#stage,#cloudFx{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none}
#stage{z-index:1;overflow:hidden;background:#020611}#stage canvas,#cloudFx{display:block;width:100%;height:100%}
#cloudFx{z-index:3;opacity:0;will-change:opacity}
</style>
</head>
<body><div id="stage"></div><canvas id="cloudFx"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const TOTAL=10.005,EARTH_END=2.12,CLOUD_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}const R=rng(23092026);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.008,1400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
const desktop=innerWidth>=900;
function setRendererQuality(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,desktop?2.0:1.28));renderer.setSize(innerWidth,innerHeight,false)}
setRendererQuality();renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdce5eb,0x313941,.84));const sun=new THREE.DirectionalLight(0xfff8ed,3.75);sun.position.set(7,5,8);scene.add(sun);
const starN=desktop?3200:2200,sp=new Float32Array(starN*3);for(let i=0;i<starN;i++){const r=70+R()*150,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;sp[i*3]=r*Math.sin(th)*Math.cos(ph);sp[i*3+1]=r*Math.cos(th);sp[i*3+2]=r*Math.sin(th)*Math.sin(ph)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.17,color:0xcbd7e4,transparent:true,opacity:.82}));scene.add(stars);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const threeBase='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthGroup=new THREE.Group();scene.add(earthGroup);
const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:8,specular:0x223649,transparent:true});
const hqEarth='https://raw.githubusercontent.com/Shriisoot/Planets-texture/main/8k_earth_daymap.jpg';
const fallbackEarth=threeBase+'earth_atmos_2048.jpg';
function applyEarthTexture(t){t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;earthMat.map=t;earthMat.needsUpdate=true}
if(desktop) loader.load(hqEarth,applyEarthTexture,undefined,()=>loader.load(fallbackEarth,applyEarthTexture)); else loader.load(fallbackEarth,applyEarthTexture);
loader.load(threeBase+'earth_normal_2048.jpg',t=>{t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());earthMat.normalMap=t;earthMat.normalScale.set(.38,.38);earthMat.needsUpdate=true});
loader.load(threeBase+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,desktop?160:104,desktop?160:104),earthMat);earthGroup.add(earth);
const earthCloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.47,depthWrite:false,color:0xffffff});loader.load(threeBase+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());earthCloudMat.map=t;earthCloudMat.needsUpdate=true});const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.006,desktop?120:80,desktop?120:80),earthCloudMat);earthGroup.add(earthClouds);
const atmoU={uOpacity:{value:.205},uColor:{value:new THREE.Color(0x87bfe8)}};const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.024,desktop?120:80,desktop?120:80),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),5.8);gl_FragColor=vec4(uColor,rim*uOpacity);}`}));earthGroup.add(atmo);
const startQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(.25,-.02,-.035));
function geoVec(lat,lon){const la=THREE.MathUtils.degToRad(lat),lo=THREE.MathUtils.degToRad(lon);return new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)).normalize()}
const gaza=geoVec(31.50,34.47),north=new THREE.Vector3(0,1,0),up=north.clone().sub(gaza.clone().multiplyScalar(north.dot(gaza))).normalize(),right=up.clone().cross(gaza).normalize();const basis=new THREE.Matrix4().makeBasis(right,up,gaza).transpose(),gazaQ=new THREE.Quaternion().setFromRotationMatrix(basis);
const earthKeys=[[0,4.18,47],[.76,4.18,47],[1.03,3.60,48],[1.32,2.82,50],[1.57,2.10,53.5],[1.80,1.53,58.5],[1.98,1.19,64.5],[2.12,1.025,69]];
function earthSample(t){for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){const q=ease((t-a[0])/(b[0]-a[0]));return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}return{z:1.025,f:69}}
const fx=document.getElementById('cloudFx'),ctx=fx.getContext('2d',{alpha:true});let W=0,H=0,DPR=1;
function resizeFx(){DPR=Math.min(devicePixelRatio||1,desktop?1.75:1.20);W=innerWidth;H=innerHeight;fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);fx.style.width=W+'px';fx.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}resizeFx();
function makeCloud(seed,shade=0){const rr=rng(seed),n=640,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.clearRect(0,0,n,n);x.globalCompositeOperation='lighter';for(let i=0;i<118;i++){const ang=rr()*Math.PI*2,rad=Math.pow(rr(),.72)*n*.235,px=n*.5+Math.cos(ang)*rad,py=n*.5+Math.sin(ang)*rad*.72,s=n*(.035+rr()*.078);const g=x.createRadialGradient(px-s*.15,py-s*.18,0,px,py,s);g.addColorStop(0,`rgba(255,255,255,${.24+rr()*.12})`);g.addColorStop(.54,`rgba(${244-shade*5},${248-shade*4},${250-shade*3},.22)`);g.addColorStop(.82,`rgba(${220-shade*8},${228-shade*7},${232-shade*6},.10)`);g.addColorStop(1,'rgba(255,255,255,0)');x.save();x.translate(px,py);x.scale(1,.72+rr()*.32);x.translate(-px,-py);x.fillStyle=g;x.beginPath();x.arc(px,py,s,0,Math.PI*2);x.fill();x.restore()}x.globalCompositeOperation='source-over';const sh=x.createLinearGradient(0,n*.22,0,n*.82);sh.addColorStop(0,'rgba(255,255,255,.10)');sh.addColorStop(.52,'rgba(205,216,223,.025)');sh.addColorStop(1,`rgba(${112-shade*7},${124-shade*6},${132-shade*5},.18)`);x.fillStyle=sh;x.fillRect(0,0,n,n);return c}
const cloudTex=[makeCloud(2311,0),makeCloud(2312,1),makeCloud(2313,2),makeCloud(2314,0),makeCloud(2315,1)];
const field=[];for(let i=0;i<44;i++)field.push({x:(R()-.5)*6.2,y:.08+R()*.95,z:.35+R()*5.3,s:.48+R()*.95,tex:Math.floor(R()*cloudTex.length)});for(let i=0;i<16;i++){const side=i%2?1:-1;field.push({x:side*(.42+R()*2.6),y:.25+R()*.45,z:.35+i*.31,s:.85+R()*.75,tex:i%cloudTex.length})}
function drawCloudDeck(t){ctx.clearRect(0,0,W,H);const q=seg(t,2.08,CLOUD_END);if(q<=0){fx.style.opacity='0';return}fx.style.opacity=String(ease(seg(t,2.08,2.28))*(1-ease(seg(t,4.68,4.92))));const sky=ctx.createLinearGradient(0,0,0,H);const gray=ease(seg(q,.58,.92));const mix=(a,b,m)=>Math.round(lerp(a,b,m));sky.addColorStop(0,`rgb(${mix(10,132,gray)},${mix(50,146,gray)},${mix(101,150,gray)})`);sky.addColorStop(.42,`rgb(${mix(58,173,gray)},${mix(129,183,gray)},${mix(184,184,gray)})`);sky.addColorStop(1,`rgb(${mix(177,196,gray)},${mix(209,201,gray)},${mix(226,199,gray)})`);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const horizon=H*(.22-.035*Math.min(q,.45));ctx.save();ctx.globalAlpha=.92*(1-ease(seg(q,.72,.98)));for(let i=0;i<15;i++){const x=(i/14)*W-W*.08,y=horizon+H*(.18+.015*Math.sin(i*1.9)),s=W*(.19+.035*(i%4));ctx.drawImage(cloudTex[i%5],x-s*.5,y-s*.30,s,s*.70)}ctx.restore();const travel=q*4.1,ordered=[...field].sort((a,b)=>b.z-a.z);for(const c of ordered){let z=c.z-travel;while(z<.23)z+=5.3;const inv=1/(.26+z),cx=W*.5+c.x*W*.18*inv,cy=horizon+H*(.20+c.y*.22)*inv,s=c.s*Math.min(W,H)*.63*inv,alpha=clamp((1-z/5.6)*1.18,.14,.92);ctx.globalAlpha=alpha;ctx.drawImage(cloudTex[c.tex],cx-s*.5,cy-s*.40,s,s*.80)}ctx.globalAlpha=1;const enter=ease(seg(q,.48,.76))*(1-ease(seg(q,.82,.98)));if(enter>0){ctx.save();ctx.globalAlpha=.30*enter;const s=Math.max(W,H)*.78;ctx.drawImage(cloudTex[1],-s*.46,H*.02,s,s*.76);ctx.drawImage(cloudTex[3],W-s*.54,H*.08,s,s*.76);ctx.drawImage(cloudTex[2],W*.18,H-s*.50,s*.88,s*.70);ctx.restore();const mist=ctx.createLinearGradient(0,0,0,H);mist.addColorStop(0,`rgba(225,233,237,${.05*enter})`);mist.addColorStop(.48,`rgba(218,227,231,${.16*enter})`);mist.addColorStop(1,`rgba(192,202,206,${.23*enter})`);ctx.fillStyle=mist;ctx.fillRect(0,0,W,H)}}
let smoothP=0,last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smoothP+=(target-smoothP)*(1-Math.exp(-8.5*dt));const t=smoothP*TOTAL;const ek=earthSample(Math.min(t,EARTH_END));camera.position.set(0,0.012,ek.z);camera.lookAt(0,0.015,0);camera.fov=ek.f;camera.updateProjectionMatrix();const rot=ease(seg(t,.02,.74));earthGroup.quaternion.copy(startQ).slerp(gazaQ,rot);earthClouds.rotation.y+=dt*.007;const ef=1-ease(seg(t,2.02,2.26));earthGroup.visible=ef>.003;stars.visible=ef>.003;earthMat.opacity=ef;earthCloudMat.opacity=.47*ef;atmoU.uOpacity.value=.205*ef;renderer.render(scene,camera);drawCloudDeck(t)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();setRendererQuality();resizeFx()});
</script></body></html>
