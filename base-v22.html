<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent — Gaza Target V22</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh;touch-action:pan-y}
#stage,#cloudSource,#transitionSky{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none}
#stage{z-index:1;overflow:hidden;background:#020611}#stage canvas{display:block;width:100%;height:100%}
#transitionSky{z-index:2;opacity:0;background:linear-gradient(180deg,#082a57 0%,#5ca7d5 55%,#c6d9e4 100%);will-change:opacity}
#cloudSource{z-index:3;border:0;opacity:0;background:transparent;will-change:opacity}
</style>
</head>
<body>
<div id="stage"></div><div id="transitionSky"></div><iframe id="cloudSource" src="./base-v19.html?v=22" title="Cloud descent"></iframe>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const TOTAL=10.005,EARTH_END=2.12;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}const R=rng(22092026);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.008,1200);
const renderer=new THREE.WebGLRenderer({antialias:innerWidth>800,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.05:1.55));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7e1e8,0x343c43,.82));const sun=new THREE.DirectionalLight(0xfff8ed,3.6);sun.position.set(7,5,8);scene.add(sun);
const starN=2600,sp=new Float32Array(starN*3);for(let i=0;i<starN;i++){const r=70+R()*130,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;sp[i*3]=r*Math.sin(th)*Math.cos(ph);sp[i*3+1]=r*Math.cos(th);sp[i*3+2]=r*Math.sin(th)*Math.sin(ph)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.19,color:0xc3d0de,transparent:true,opacity:.78}));scene.add(stars);
const loader=new THREE.TextureLoader(),texBase='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthGroup=new THREE.Group();scene.add(earthGroup);
const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:9,specular:0x253649,transparent:true});loader.load(texBase+'earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.needsUpdate=true});loader.load(texBase+'earth_normal_2048.jpg',t=>{earthMat.normalMap=t;earthMat.normalScale.set(.45,.45);earthMat.needsUpdate=true});loader.load(texBase+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,112,112),earthMat);earthGroup.add(earth);
const cloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.52,depthWrite:false,color:0xffffff});loader.load(texBase+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;cloudMat.map=t;cloudMat.needsUpdate=true});const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.006,84,84),cloudMat);earthGroup.add(earthClouds);
const atmoU={uOpacity:{value:.22},uColor:{value:new THREE.Color(0x86bde4)}};const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.026,84,84),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),5.4);gl_FragColor=vec4(uColor,rim*uOpacity);}`}));earthGroup.add(atmo);
const startQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(.25,-.02,-.035));
function geoVec(lat,lon){const la=THREE.MathUtils.degToRad(lat),lo=THREE.MathUtils.degToRad(lon);return new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)).normalize()}
const gaza=geoVec(31.50,34.47),north=new THREE.Vector3(0,1,0),up=north.clone().sub(gaza.clone().multiplyScalar(north.dot(gaza))).normalize(),right=up.clone().cross(gaza).normalize();const basis=new THREE.Matrix4().makeBasis(right,up,gaza).transpose(),gazaQ=new THREE.Quaternion().setFromRotationMatrix(basis);
const earthKeys=[[0,4.15,47],[.72,4.15,47],[1.03,3.62,48],[1.32,2.86,50],[1.57,2.14,53.5],[1.79,1.55,58.5],[1.98,1.19,64.5],[2.12,1.025,69]];
function earthSample(t){for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){const q=ease(clamp((t-a[0])/(b[0]-a[0])));return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}return{z:1.025,f:69}}
const transitionSky=document.getElementById('transitionSky'),cloudSource=document.getElementById('cloudSource');let childReady=false,lastChild=-1;cloudSource.addEventListener('load',()=>childReady=true);
let smoothP=0,last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smoothP+=(target-smoothP)*(1-Math.exp(-8*dt));const t=smoothP*TOTAL;
 const turn=ease(seg(t,.06,.72));earthGroup.quaternion.slerpQuaternions(startQ,gazaQ,turn);
 const ek=earthSample(Math.min(t,EARTH_END));camera.position.set(0,.012,ek.z);camera.lookAt(0,.015,0);camera.fov=ek.f;camera.updateProjectionMatrix();earthClouds.rotation.y=.008*Math.sin(t*.75);
 const ef=1-ease(seg(t,2.06,2.28));earthGroup.visible=ef>.003;stars.visible=ef>.003;earthMat.opacity=ef;cloudMat.opacity=.52*ef;atmoU.uOpacity.value=.22*ef*(1+seg(t,1.62,2.08)*.20);scene.background.set(0x020611);renderer.render(scene,camera);
 transitionSky.style.opacity=String(ease(seg(t,2.05,2.31))*(1-ease(seg(t,2.28,2.47))));
 cloudSource.style.opacity=String(ease(seg(t,2.22,2.38)));
 if(childReady){const cp=clamp(t/TOTAL);if(Math.abs(cp-lastChild)>.00002){try{const w=cloudSource.contentWindow,m=w.document.documentElement.scrollHeight-w.innerHeight;w.scrollTo(0,cp*m);lastChild=cp}catch(e){}}}
}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.05:1.55))});
</script></body></html>
