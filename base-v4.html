<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Atlas Descent 3D — Cloud Match V4</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}
body{height:950vh}
#stage{position:fixed;inset:0;overflow:hidden;background:#020611}
canvas{display:block;width:100%;height:100%}
#spark{position:fixed;right:6.2vw;bottom:15.2vh;width:18px;height:18px;opacity:.34;pointer-events:none;filter:drop-shadow(0 0 7px rgba(205,228,255,.35))}
#spark:before,#spark:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(218,235,249,.95),transparent)}
#spark:before{width:18px;height:1px}#spark:after{width:1px;height:18px;background:linear-gradient(180deg,transparent,rgba(218,235,249,.95),transparent)}
</style>
</head>
<body>
<div id="stage"></div><div id="spark"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const TOTAL=10.005, EARTH_END=2.12, CLOUDS_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260907);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020611);
scene.fog=new THREE.Fog(0x9aa3a5,1000,2000);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.008,1800);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<768?1.35:1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;
document.getElementById('stage').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xd8e6f3,0x4e514f,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff9ef,4.4);sun.position.set(7,6,8);scene.add(sun);
const cool=new THREE.DirectionalLight(0x7fa8d5,.55);cool.position.set(-8,3,-4);scene.add(cool);

// ---------- SPACE + EARTH ----------
const spaceGroup=new THREE.Group();scene.add(spaceGroup);
const starN=3600,starPos=new Float32Array(starN*3),starCol=new Float32Array(starN*3);
const cc=new THREE.Color();
for(let i=0;i<starN;i++){
 const r=70+R()*120,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;
 starPos[i*3]=r*Math.sin(th)*Math.cos(ph);starPos[i*3+1]=r*Math.cos(th);starPos[i*3+2]=r*Math.sin(th)*Math.sin(ph);
 cc.setHSL(.57+R()*.08,.18+R()*.25,.55+R()*.35);starCol[i*3]=cc.r;starCol[i*3+1]=cc.g;starCol[i*3+2]=cc.b;
}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(starPos,3));sg.setAttribute('color',new THREE.BufferAttribute(starCol,3));
spaceGroup.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.24,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true})));

function nebulaTexture(){const s=512,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#020611';x.fillRect(0,0,s,s);for(let i=0;i<28;i++){const px=R()*s,py=R()*s,rr=70+R()*170;const g=x.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,`rgba(${20+R()*25|0},${45+R()*45|0},${90+R()*60|0},${.018+R()*.025})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s)}return new THREE.CanvasTexture(c)}
const nebula=new THREE.Sprite(new THREE.SpriteMaterial({map:nebulaTexture(),transparent:true,opacity:.72,depthWrite:false}));nebula.scale.set(185,104,1);nebula.position.set(-8,2,-40);nebula.material.opacity=.86;spaceGroup.add(nebula);

const earthGroup=new THREE.Group();scene.add(earthGroup);
const loader=new THREE.TextureLoader();
const base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:11,specular:0x26394f});
loader.load(base+'earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.needsUpdate=true});
loader.load(base+'earth_normal_2048.jpg',t=>{earthMat.normalMap=t;earthMat.normalScale.set(.55,.55);earthMat.needsUpdate=true});
loader.load(base+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),earthMat);earthGroup.add(earth);
const cloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.62,depthWrite:false,color:0xffffff});
loader.load(base+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;cloudMat.map=t;cloudMat.needsUpdate=true});
const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.011,96,96),cloudMat);earthGroup.add(earthClouds);
earthGroup.rotation.set(.27,0,-.045);

const atmoUniforms={uPower:{value:1.22},uOpacity:{value:.92},uColor:{value:new THREE.Color(0x72c3ff)}};
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.08,96,96),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoUniforms,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uPower,uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),3.6);gl_FragColor=vec4(uColor,rim*uOpacity*uPower);}`}));earthGroup.add(atmo);

// ---------- CLOUD WORLD — reference-matched 2.12s → 4.82s ----------
const cloudWorld=new THREE.Group();scene.add(cloudWorld);
const cloudPos=[],cloudSize=[],cloudShade=[],cloudRand=[];
function addPuff(x,y,z,size,shade=0.25){cloudPos.push(x,y,z);cloudSize.push(size);cloudShade.push(clamp(shade));cloudRand.push(R())}
function addCloudCluster(cx,cy,cz,sx,sy,sz,count,baseSize,shade=0.25){
 for(let i=0;i<count;i++){
  const rx=(R()+R()+R()-1.5)/1.5, ry=(R()+R()+R()-1.5)/1.5, rz=(R()+R()+R()-1.5)/1.5;
  const crown=Math.max(0,1-Math.abs(ry));
  addPuff(cx+rx*sx,cy+ry*sy,cz+rz*sz,baseSize*(.62+R()*.72)*(1+crown*.18),shade+R()*.22);
 }
}
for(let i=0;i<62;i++){
 const z=20-R()*520,x=(R()-.5)*620,y=17+R()*20;
 addCloudCluster(x,y,z,34+R()*58,7+R()*10,30+R()*55,14+Math.floor(R()*10),20+R()*15,.05+R()*.18);
}
for(let i=0;i<34;i++){
 const side=R()>.5?1:-1;
 const x=side*(34+R()*135),z=130-R()*430,y=36+R()*38;
 addCloudCluster(x,y,z,24+R()*42,38+R()*70,24+R()*46,30+Math.floor(R()*25),24+R()*18,.10+R()*.24);
 addCloudCluster(x+(R()-.5)*12,y+36+R()*34,z+(R()-.5)*12,22+R()*28,20+R()*35,20+R()*30,18+Math.floor(R()*16),23+R()*16,.02+R()*.12);
}
[
 [-42,60,92,58,58,50], [52,68,66,62,72,54], [-18,52,28,68,55,58],
 [42,47,-8,70,60,62], [-48,42,-46,72,58,66], [16,38,-88,84,50,70],
 [-28,35,-132,90,44,76]
].forEach((v,j)=>addCloudCluster(v[0],v[1],v[2],v[3],v[4],v[5],72,31+j*.9,.16+j*.035));

const cloudGeo=new THREE.BufferGeometry();
cloudGeo.setAttribute('position',new THREE.Float32BufferAttribute(cloudPos,3));
cloudGeo.setAttribute('aSize',new THREE.Float32BufferAttribute(cloudSize,1));
cloudGeo.setAttribute('aShade',new THREE.Float32BufferAttribute(cloudShade,1));
cloudGeo.setAttribute('aRand',new THREE.Float32BufferAttribute(cloudRand,1));
const cloudUniforms={uOpacity:{value:0},uCamPhase:{value:0},uTop:{value:new THREE.Color(0xf7fbff)},uMid:{value:new THREE.Color(0xd8e2e8)},uShadow:{value:new THREE.Color(0x96a7b1)}};
const cloudMat3D=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.NormalBlending,uniforms:cloudUniforms,
 vertexShader:`attribute float aSize,aShade,aRand;varying float vShade,vRand,vDepth;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vShade=aShade;vRand=aRand;vDepth=-mv.z;gl_PointSize=clamp(aSize*(360.0/max(12.0,-mv.z)),3.0,280.0);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform float uOpacity,uCamPhase;uniform vec3 uTop,uMid,uShadow;varying float vShade,vRand,vDepth;void main(){vec2 p=gl_PointCoord-.5;float r=length(p);float a=atan(p.y,p.x);float edge=.48+.035*sin(a*5.0+vRand*6.283)+.02*sin(a*9.0-vRand*4.0);float alpha=smoothstep(edge,edge-.22,r);float core=smoothstep(.5,.02,r);vec3 c=mix(uTop,uMid,clamp(vShade*1.25,0.,1.));c=mix(c,uShadow,clamp(vShade*.72+uCamPhase*.18,0.,.72));c*=.96+core*.10;float nearFade=smoothstep(3.0,22.0,vDepth);gl_FragColor=vec4(c,alpha*uOpacity*nearFade);}`
});
const cloudPoints=new THREE.Points(cloudGeo,cloudMat3D);cloudPoints.frustumCulled=false;cloudWorld.add(cloudPoints);

const skyGeo=new THREE.SphereGeometry(650,32,20);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,transparent:true,uniforms:{uMix:{value:0},uOpacity:{value:0},uHorizon:{value:1}},vertexShader:`varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float uMix,uOpacity,uHorizon;varying float h;void main(){vec3 top=mix(vec3(.008,.055,.145),vec3(.42,.47,.48),uMix);vec3 hor=mix(vec3(.44,.77,1.0),vec3(.75,.79,.79),uMix);vec3 bot=mix(vec3(.60,.73,.82),vec3(.55,.58,.57),uMix);vec3 c=h>0.?mix(hor,top,pow(clamp(h,0.,1.),.50)):mix(hor,bot,pow(clamp(-h,0.,1.),.62));float band=exp(-abs(h)*38.0)*uHorizon;c+=vec3(.30,.55,.70)*band*.55;gl_FragColor=vec4(c,uOpacity);}`});
const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);

// ---------- RUINED CITY ----------
const city=new THREE.Group();scene.add(city);
const concrete=new THREE.MeshStandardMaterial({color:0x777b78,roughness:1});
const concreteDark=new THREE.MeshStandardMaterial({color:0x575c59,roughness:1});
const concreteLight=new THREE.MeshStandardMaterial({color:0x92958f,roughness:1});
const groundMat=new THREE.MeshStandardMaterial({color:0x555b57,roughness:1});
const unitBox=new THREE.BoxGeometry(1,1,1);
function cube(parent,x,y,z,sx,sy,sz,mat=concrete,ry=0,rz=0){const m=new THREE.Mesh(unitBox,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.y=ry;m.rotation.z=rz;parent.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(520,720,1,1),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-210);city.add(ground);
for(const x of [-36,0,38]) cube(city,x,.03,-210,7,.06,700,new THREE.MeshStandardMaterial({color:0x4d524f,roughness:1}),0,0);

function ruinedBuilding(x,z,w,d,floors,damage=0.5){
 const g=new THREE.Group();g.position.set(x,0,z);city.add(g);const fh=4.2,total=floors*fh;
 const colsX=Math.max(2,Math.round(w/5)), colsZ=Math.max(2,Math.round(d/5));
 for(let ix=0;ix<=colsX;ix++)for(let iz=0;iz<=colsZ;iz++){
  if(R()<damage*.12)continue;const h=total*(.55+R()*.45);cube(g,-w/2+ix*(w/colsX),h/2,-d/2+iz*(d/colsZ),.34,h,.34,R()>.5?concrete:concreteDark);
 }
 for(let f=1;f<=floors;f++){
  const y=f*fh;const missing=R()<damage*(.26+f/floors*.28);
  if(!missing){
   const cut=R()<damage*.55;
   if(cut){cube(g,-w*.18,y,-d*.03,w*.58,.22,d*.94,concreteLight,0,(R()-.5)*.035);cube(g,w*.32,y,d*.08,w*.22,.22,d*.72,concrete,0,(R()-.5)*.08)}
   else cube(g,0,y,0,w,.22,d,R()>.72?concreteLight:concrete);
  } else if(R()>.35){cube(g,(R()-.5)*w*.35,y,(R()-.5)*d*.25,w*(.25+R()*.25),.22,d*(.25+R()*.35),concrete,0,(R()-.5)*.16)}
 }
 for(let i=0;i<Math.floor(floors*.9);i++){
  if(R()<.42){const y=(1+i)*fh-1.3;cube(g,-w/2-.05,y,(R()-.5)*d,.18,2.2,2+R()*3,concreteDark,0,(R()-.5)*.12)}
 }
 g.rotation.y=(R()-.5)*.12;
}
const hero=[[-42,35,22,18,8,.6],[33,8,18,16,11,.52],[-8,-20,26,20,7,.72],[52,-48,20,17,9,.63],[-55,-72,18,18,12,.58],[8,-92,23,18,10,.67],[46,-126,16,15,13,.62],[-39,-140,24,18,8,.73],[-2,-168,19,17,11,.55],[57,-194,24,18,7,.78],[-54,-220,21,18,10,.68],[14,-242,27,21,8,.72],[44,-284,17,16,12,.59],[-34,-310,20,19,10,.69]];
hero.forEach(v=>ruinedBuilding(...v));
for(let i=0;i<52;i++){const x=(R()-.5)*230,z=20-R()*390;if(Math.abs(x)<65&&R()<.48)continue;ruinedBuilding(x,z,10+R()*15,10+R()*13,4+Math.floor(R()*9),.28+R()*.42)}

const rubbleGeo=new THREE.TetrahedronGeometry(1,0);const rubbleMat=new THREE.MeshStandardMaterial({color:0x737671,roughness:1});const rubble=new THREE.InstancedMesh(rubbleGeo,rubbleMat,1700);const tm=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
for(let i=0;i<1700;i++){const z=60-R()*430,x=(R()-.5)*180;const rr=.18+R()*1.35;p.set(x,.18+R()*.5,z);q.setFromEuler(new THREE.Euler(R()*Math.PI,R()*Math.PI,R()*Math.PI));s.set(rr*(.4+R()*1.6),rr*(.2+R()*.7),rr*(.4+R()*1.9));tm.compose(p,q,s);rubble.setMatrixAt(i,tm)}city.add(rubble);

function smokeTexture(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(120,125,122,.25)');g.addColorStop(.55,'rgba(95,101,98,.14)');g.addColorStop(1,'rgba(70,75,72,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c)}
const smokeTex=smokeTexture();const smokeSprites=[];
for(let i=0;i<17;i++){const cx=(R()-.5)*180,cz=20-R()*400;for(let j=0;j<5;j++){const sm=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xa5aaa7,transparent:true,opacity:.0,depthWrite:false}));sm.position.set(cx+(R()-.5)*9,7+j*7+R()*5,cz+(R()-.5)*8);const ss=18+j*7+R()*12;sm.scale.set(ss,ss,1);city.add(sm);smokeSprites.push(sm)}}

// ---------- TIMELINE ----------
let smooth=0,last=performance.now();
const look=new THREE.Vector3();
const earthKeys=[
 [0.00,2.94,50.0],[0.50,2.90,50.0],[1.00,2.57,50.5],[1.25,2.06,51.5],[1.50,1.56,54.0],[1.75,1.225,58.5],[1.95,1.075,63.5],[2.12,1.018,68.0]
];
function earthSample(t){
 if(t<=earthKeys[0][0])return {z:earthKeys[0][1],f:earthKeys[0][2]};
 for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){let q=clamp((t-a[0])/(b[0]-a[0]));q=smoothstep(q);return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}
 const k=earthKeys[earthKeys.length-1];return{z:k[1],f:k[2]};
}
function earthPath(t){const p=seg(t,0,EARTH_END),k=earthSample(t);const dive=seg(t,1.42,2.12);return{pos:new THREE.Vector3(lerp(0,.018,dive),lerp(.015,.075,dive),k.z),look:new THREE.Vector3(lerp(0,.01,dive),lerp(.03,.115,dive),0),fov:k.f}}
const cloudKeys=[
 [2.12, 0,98,205,   0,30,-220,66.0],
 [2.45,-1,94,165,   0,31,-210,65.5],
 [2.80, 2,88,128,   0,33,-190,64.5],
 [3.15,-3,78,100,   4,36,-165,63.0],
 [3.50, 5,67, 82,  -2,38,-130,61.5],
 [3.85,-4,56, 70,   4,34, -95,60.5],
 [4.20, 3,46, 64,  -2,27, -65,60.0],
 [4.50,-2,39, 60,   2,19, -35,60.0],
 [4.82, 0,34, 58,   0,12, -12,59.0]
];
function cloudPath(t){
 let a=cloudKeys[0],b=cloudKeys[cloudKeys.length-1];
 for(let i=1;i<cloudKeys.length;i++){if(t<=cloudKeys[i][0]){a=cloudKeys[i-1];b=cloudKeys[i];break}}
 let q=clamp((t-a[0])/(b[0]-a[0]));q=smoothstep(q);
 return{pos:new THREE.Vector3(lerp(a[1],b[1],q),lerp(a[2],b[2],q),lerp(a[3],b[3],q)),look:new THREE.Vector3(lerp(a[4],b[4],q),lerp(a[5],b[5],q),lerp(a[6],b[6],q)),fov:lerp(a[7],b[7],q)}
}
function cityPath(t){const p=seg(t,CLOUDS_END,TOTAL),e=smoothstep(p);const z=lerp(58,-330,e),y=lerp(34,18,e),x=Math.sin(p*Math.PI*2.2)*8 + lerp(0,-3,p);return{pos:new THREE.Vector3(x,y,z),look:new THREE.Vector3(x*.15,lerp(9,8,p),z-70),fov:lerp(59,66,p)}}
function pathAt(t){return t<=EARTH_END?earthPath(t):t<=CLOUDS_END?cloudPath(t):cityPath(t)}

function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;
 const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smooth+=(target-smooth)*(1-Math.exp(-6.8*dt));const t=smooth*TOTAL;const p=pathAt(t);
 camera.position.copy(p.pos);look.lerp(p.look,1-Math.exp(-13*dt));camera.lookAt(look);if(Math.abs(camera.fov-p.fov)>.02){camera.fov=p.fov;camera.updateProjectionMatrix()}
 earth.rotation.y+=dt*.006;earthClouds.rotation.y+=dt*.012;
 const earthFade=1-seg(t,2.02,2.24);earthGroup.visible=earthFade>.01;spaceGroup.visible=earthFade>.01;earthMat.opacity=earthFade;earthMat.transparent=earthFade<.999;cloudMat.opacity=.62*earthFade;atmoUniforms.uOpacity.value=.92*earthFade;atmoUniforms.uPower.value=1.22+seg(t,1.48,2.1)*1.65;
 const cIn=seg(t,2.04,2.32),cOut=1-seg(t,4.88,5.34),cAlpha=cIn*cOut;cloudWorld.visible=cAlpha>.005;const cpCloud=seg(t,EARTH_END,CLOUDS_END);cloudUniforms.uOpacity.value=.92*cAlpha;cloudUniforms.uCamPhase.value=Math.sin(cpCloud*Math.PI);
 const cityIn=seg(t,4.64,5.12);city.visible=cityIn>.005;for(const sm of smokeSprites)sm.material.opacity=.22*cityIn;
 sky.visible=t>2.02;sky.position.copy(camera.position);skyMat.uniforms.uOpacity.value=seg(t,2.00,2.30);skyMat.uniforms.uMix.value=seg(t,4.38,5.55);skyMat.uniforms.uHorizon.value=1-seg(t,3.55,4.70)*.72;
 if(t<2.02){scene.fog.near=900;scene.fog.far=1600;scene.fog.color.set(0x020611)}
 else if(t<CLOUDS_END){const cp=seg(t,EARTH_END,CLOUDS_END);const enter=seg(cp,.28,.57),exit=1-seg(cp,.82,1.0),inside=enter*exit;scene.fog.near=lerp(110,3.5,inside);scene.fog.far=lerp(560,72,inside);scene.fog.color.set(0xd6e3eb).lerp(new THREE.Color(0xb4c0c6),inside)}
 else{const cp=seg(t,CLOUDS_END,TOTAL);scene.fog.near=18;scene.fog.far=lerp(185,145,cp);scene.fog.color.set(0xb0b5b2)}
 hemi.intensity=t<EARTH_END?1.18:t<CLOUDS_END?1.0:1.32;sun.intensity=t<EARTH_END?3.35:t<CLOUDS_END?4.4:2.6;renderer.toneMappingExposure=t<EARTH_END?1.14:t<CLOUDS_END?1.12:.92;
 const earthBlur=t<EARTH_END?seg(t,1.52,2.10)*1.15:0,cloudBlur=(t>=EARTH_END&&t<CLOUDS_END)?Math.sin(seg(t,3.18,4.62)*Math.PI)*.28:0,speedBlur=Math.max(earthBlur,cloudBlur);renderer.domElement.style.filter=speedBlur>.01?`blur(${speedBlur.toFixed(2)}px) saturate(${(1.04+speedBlur*.035).toFixed(2)}) contrast(1.03)`:'';
 document.getElementById('spark').style.opacity=t<4.82?String(.34*(1-seg(t,4.55,4.82))):'0';
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.35:1.8))});
</script>
</body></html>
