<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent 3D — Cloud Reconstruction V10</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh}#stage{position:fixed;inset:0;overflow:hidden;background:#020611}canvas{display:block;width:100%;height:100%}#mist{position:fixed;inset:-10%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 25% 42%,rgba(255,255,255,.75),rgba(214,223,228,.30) 30%,transparent 58%),radial-gradient(ellipse at 78% 58%,rgba(242,247,249,.65),rgba(181,194,201,.28) 38%,transparent 68%),linear-gradient(180deg,rgba(218,228,234,.08),rgba(178,190,197,.28));filter:blur(10px);transform:scale(1.08);will-change:opacity}#spark{position:fixed;right:6.2vw;bottom:15.2vh;width:18px;height:18px;opacity:.34;pointer-events:none;filter:drop-shadow(0 0 7px rgba(205,228,255,.35))}#spark:before,#spark:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,rgba(218,235,249,.95),transparent)}#spark:before{width:18px;height:1px}#spark:after{width:1px;height:18px;background:linear-gradient(180deg,transparent,rgba(218,235,249,.95),transparent)}
</style>
</head>
<body><div id="stage"></div><div id="mist"></div><div id="spark"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const TOTAL=10.005,EARTH_END=2.12,CLOUDS_END=4.82,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}const R=rng(20260910);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);scene.fog=new THREE.Fog(0x9aaab2,900,1600);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.008,1800);
const renderer=new THREE.WebGLRenderer({antialias:innerWidth>768,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.12:1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('stage').appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xd8e6f3,0x4e514f,1.0);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff9ef,4.1);sun.position.set(7,6,8);scene.add(sun);const cool=new THREE.DirectionalLight(0x7fa8d5,.48);cool.position.set(-8,3,-4);scene.add(cool);
// SPACE + EARTH (kept from approved phase)
const space=new THREE.Group();scene.add(space);const starN=3000,starPos=new Float32Array(starN*3);for(let i=0;i<starN;i++){const r=70+R()*120,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;starPos[i*3]=r*Math.sin(th)*Math.cos(ph);starPos[i*3+1]=r*Math.cos(th);starPos[i*3+2]=r*Math.sin(th)*Math.sin(ph)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(starPos,3));space.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.24,color:0xb7c9e0,transparent:true,opacity:.88})));
const earthGroup=new THREE.Group();scene.add(earthGroup);const loader=new THREE.TextureLoader(),base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:11,specular:0x26394f,transparent:true});loader.load(base+'earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.needsUpdate=true});loader.load(base+'earth_normal_2048.jpg',t=>{earthMat.normalMap=t;earthMat.normalScale.set(.55,.55);earthMat.needsUpdate=true});loader.load(base+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});const earth=new THREE.Mesh(new THREE.SphereGeometry(1,112,112),earthMat);earthGroup.add(earth);const earthCloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.62,depthWrite:false,color:0xffffff});loader.load(base+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;earthCloudMat.map=t;earthCloudMat.needsUpdate=true});const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.011,80,80),earthCloudMat);earthGroup.add(earthClouds);earthGroup.rotation.set(.27,0,-.045);const atmoU={uPower:{value:1.22},uOpacity:{value:.92},uColor:{value:new THREE.Color(0x72c3ff)}};const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.08,72,72),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uPower,uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),3.6);gl_FragColor=vec4(uColor,rim*uOpacity*uPower);}`}));earthGroup.add(atmo);
// ROBUST CLOUD BILLBOARDS — no gl_PointSize dependency
function cloudTexture(){const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');for(let i=0;i<13;i++){const px=n*(.24+R()*.52),py=n*(.26+R()*.48),rr=n*(.13+R()*.20),g=x.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,'rgba(255,255,255,.92)');g.addColorStop(.47,'rgba(247,250,251,.64)');g.addColorStop(.76,'rgba(211,220,225,.28)');g.addColorStop(1,'rgba(190,202,208,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,Math.PI*2);x.fill()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}const cloudTex=cloudTexture();const plane=new THREE.PlaneGeometry(1,1);const cloudGroup=new THREE.Group();scene.add(cloudGroup);const mats=[new THREE.MeshBasicMaterial({map:cloudTex,color:0xf8fbfd,transparent:true,opacity:.82,depthWrite:false,side:THREE.DoubleSide,fog:true}),new THREE.MeshBasicMaterial({map:cloudTex,color:0xdde5e9,transparent:true,opacity:.78,depthWrite:false,side:THREE.DoubleSide,fog:true}),new THREE.MeshBasicMaterial({map:cloudTex,color:0xaebbc2,transparent:true,opacity:.68,depthWrite:false,side:THREE.DoubleSide,fog:true})];const buckets=[[],[],[]],M=new THREE.Matrix4(),P=new THREE.Vector3(),Q=new THREE.Quaternion(),S=new THREE.Vector3();function puff(bucket,x,y,z,w,h,rz=0){P.set(x,y,z);Q.setFromEuler(new THREE.Euler(0,0,rz));S.set(w,h,1);M.compose(P,Q,S);buckets[bucket].push(M.clone())}function cluster(cx,cy,cz,sx,sy,sz,count,size,shade=0){for(let i=0;i<count;i++){const rx=(R()+R()+R()-1.5)/1.5,ry=(R()+R()+R()-1.5)/1.5,rz=(R()+R()+R()-1.5)/1.5,ss=size*(.62+R()*.64);puff(Math.min(2,shade+(R()>.72?1:0)),cx+rx*sx,cy+ry*sy,cz+rz*sz,ss*(1.25+R()*.55),ss*(.72+R()*.38),(R()-.5)*.18)}}
// low deck across horizon
for(let i=0;i<38;i++){const x=(R()-.5)*520,z=80-R()*420;cluster(x,34+R()*8,z,36+R()*48,7+R()*7,28+R()*48,4,34+R()*18,R()>.72?1:0)}
// giant towers placed directly around camera path
const towers=[[ -52,92,160,58,45,42,16,42,0],[58,86,138,64,52,46,18,46,0],[-22,78,116,72,58,50,20,50,0],[42,70,98,76,62,52,21,53,0],[-48,61,84,82,66,58,23,55,1],[20,53,73,88,63,62,24,57,1],[-18,45,65,92,58,66,25,60,1]];towers.forEach(v=>cluster(...v));
// close puffs to guarantee camera immersion, kept off exact center to avoid flat white screen
for(let i=0;i<48;i++){const z=158-i*2.1+(R()-.5)*9,y=88-i*.9+(R()-.5)*14,side=i%2?1:-1,x=side*(15+R()*42);cluster(x,y,z,18+R()*20,14+R()*28,10+R()*18,3,28+R()*22,i>24?1:0)}
for(let b=0;b<3;b++){const inst=new THREE.InstancedMesh(plane,mats[b],buckets[b].length);buckets[b].forEach((m,i)=>inst.setMatrixAt(i,m));inst.instanceMatrix.needsUpdate=true;inst.frustumCulled=false;cloudGroup.add(inst)}
// sky dome: blue only near top, quickly becomes overcast
const sky=new THREE.Mesh(new THREE.SphereGeometry(620,28,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,transparent:true,uniforms:{uMix:{value:0},uOpacity:{value:0}},vertexShader:`varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float uMix,uOpacity;varying float h;void main(){vec3 top=mix(vec3(.025,.12,.28),vec3(.46,.50,.50),uMix);vec3 hor=mix(vec3(.54,.73,.88),vec3(.73,.76,.75),uMix);vec3 bot=mix(vec3(.64,.74,.80),vec3(.60,.63,.62),uMix);vec3 c=h>0.?mix(hor,top,pow(clamp(h,0.,1.),.55)):mix(hor,bot,pow(clamp(-h,0.,1.),.7));gl_FragColor=vec4(c,uOpacity);}`}));scene.add(sky);
// keyframe paths
const earthKeys=[[0,2.94,50],[.5,2.90,50],[1,2.57,50.5],[1.25,2.06,51.5],[1.5,1.56,54],[1.75,1.225,58.5],[1.95,1.075,63.5],[2.12,1.018,68]];function eSample(t){for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){const q=ease(clamp((t-a[0])/(b[0]-a[0])));return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}return{z:1.018,f:68}}function earthPath(t){const k=eSample(t),d=seg(t,1.42,2.12);return{p:new THREE.Vector3(lerp(0,.018,d),lerp(.015,.075,d),k.z),l:new THREE.Vector3(lerp(0,.01,d),lerp(.03,.115,d),0),f:k.f}}
const ck=[[2.12,0,98,205,0,33,45,66],[2.45,-1,92,174,0,39,18,65],[2.80,2,84,145,0,43,-8,64],[3.15,-3,75,121,3,44,-34,63],[3.50,4,65,101,-2,42,-58,61.5],[3.85,-4,55,84,3,36,-78,60.5],[4.20,3,47,72,-2,29,-94,60],[4.50,-2,40,64,2,21,-108,60],[4.82,0,35,60,0,14,-122,59]];function cloudPath(t){let a=ck[0],b=ck.at(-1);for(let i=1;i<ck.length;i++)if(t<=ck[i][0]){a=ck[i-1];b=ck[i];break}const q=ease(clamp((t-a[0])/(b[0]-a[0])));return{p:new THREE.Vector3(lerp(a[1],b[1],q),lerp(a[2],b[2],q),lerp(a[3],b[3],q)),l:new THREE.Vector3(lerp(a[4],b[4],q),lerp(a[5],b[5],q),lerp(a[6],b[6],q)),f:lerp(a[7],b[7],q)}}
let smooth=0,last=performance.now();const look=new THREE.Vector3(),mist=document.getElementById('mist'),spark=document.getElementById('spark');function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smooth+=(target-smooth)*(1-Math.exp(-7.2*dt));const t=smooth*TOTAL,k=t<=EARTH_END?earthPath(t):cloudPath(Math.min(t,CLOUDS_END));camera.position.copy(k.p);look.lerp(k.l,1-Math.exp(-14*dt));camera.lookAt(look);camera.fov=k.f;camera.updateProjectionMatrix();earth.rotation.y+=dt*.006;earthClouds.rotation.y+=dt*.012;
const ef=1-seg(t,2.03,2.30);earthGroup.visible=ef>.01;space.visible=ef>.01;earthMat.opacity=ef;earthCloudMat.opacity=.62*ef;atmoU.uOpacity.value=.92*ef;atmoU.uPower.value=1.22+seg(t,1.50,2.10)*1.55;
const ci=seg(t,2.02,2.30),co=1-seg(t,4.70,5.05),ca=ci*co;cloudGroup.visible=ca>.002;mats[0].opacity=.88*ca;mats[1].opacity=.82*ca;mats[2].opacity=.72*ca;sky.visible=t>2.0;sky.position.copy(camera.position);sky.material.uniforms.uOpacity.value=seg(t,2.0,2.30);sky.material.uniforms.uMix.value=seg(t,2.65,4.30);
const enter=seg(t,2.75,3.55),exit=1-seg(t,4.20,4.75),inside=enter*exit;scene.fog.near=lerp(130,2.5,inside);scene.fog.far=lerp(480,58,inside);scene.fog.color.set(0xd6e2e7).lerp(new THREE.Color(0xaebbc1),inside);mist.style.opacity=String((inside*.58+seg(t,3.15,3.70)*exit*.14).toFixed(3));spark.style.opacity=t<4.82?String(.34*(1-seg(t,4.50,4.82))):'0';renderer.toneMappingExposure=t<2.12?1.12:lerp(1.08,.93,seg(t,3.20,4.60));renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.12:1.7))});
</script></body></html>
