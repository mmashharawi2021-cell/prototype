<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent — Gaza Sequence V22</title>
<style>
:root{--mix:0;--grade:0;--end:0}*{box-sizing:border-box}html,body{margin:0;background:#020611;overflow-x:hidden}html{overscroll-behavior-y:none}body{height:1000.5vh;touch-action:pan-y}
#baseWrap,#cityWrap,#grade,#endTitle{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none;overflow:hidden}
#base{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#020611}#city{position:absolute;inset:0;width:100%;height:100%}#city canvas{display:block;width:100%!important;height:100%!important}
#baseWrap{opacity:calc(1 - var(--mix));will-change:opacity}#cityWrap{opacity:var(--mix);filter:saturate(.86) contrast(1.01) brightness(1.01);will-change:opacity}
#grade{z-index:10;background:linear-gradient(to bottom,rgba(18,26,28,0),rgba(62,70,66,.026)),radial-gradient(circle at 50% 48%,rgba(255,255,255,0) 63%,rgba(18,22,20,.04) 100%);opacity:var(--grade);mix-blend-mode:multiply}
#endTitle{z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;opacity:var(--end);transform:translateY(calc((1 - var(--end))*14px));will-change:opacity,transform;background:linear-gradient(to bottom,transparent 56%,rgba(10,13,12,.16) 100%)}
#endTitle .inner{margin-top:36vh;padding:0 22px;color:#f2f3ef;text-shadow:0 2px 18px rgba(0,0,0,.40)}#endTitle .name{font:600 clamp(21px,5.2vw,46px)/1.08 Arial,sans-serif;letter-spacing:.075em;text-transform:uppercase}#endTitle .role{margin-top:9px;font:500 clamp(11px,2.7vw,16px)/1 Arial,sans-serif;letter-spacing:.29em;text-transform:uppercase;opacity:.80}
</style>
</head>
<body>
<div id="baseWrap"><iframe id="base" src="./base-v22.html?v=22" title="Earth and cloud sequence"></iframe></div>
<div id="cityWrap"><div id="city"></div></div><div id="grade"></div>
<div id="endTitle"><div class="inner"><div class="name">Mohanad Al-Mashharawi</div><div class="role">GIS Engineer</div></div></div>
<script>
const TOTAL=10.005,CITY_PEEK=4.74,CLOUD_END=4.82,CITY_FULL=5.10;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t);
const root=document.documentElement,base=document.getElementById('base');let cityReady=false,baseReady=false,last=-1,target=0;
function progress(){const m=document.documentElement.scrollHeight-innerHeight;return m>0?clamp(scrollY/m):0}function update(){target=progress()}
addEventListener('scroll',update,{passive:true});addEventListener('resize',update,{passive:true});base.addEventListener('load',()=>{baseReady=true;update()});addEventListener('atlas-city-ready',()=>{cityReady=true});addEventListener('atlas-city-lost',()=>{cityReady=false});update();
function frame(){requestAnimationFrame(frame);const p=target,t=p*TOTAL,mix=cityReady?ease(clamp((t-CITY_PEEK)/(CITY_FULL-CITY_PEEK))):0;root.style.setProperty('--mix',mix.toFixed(4));root.style.setProperty('--grade',(cityReady?ease(clamp((t-4.80)/.62)):0).toFixed(4));const end=cityReady?ease(clamp((t-9.34)/.44)):0;root.style.setProperty('--end',end.toFixed(4));if(baseReady){const bt=Math.min(t,CLOUD_END),bp=bt/TOTAL;if(Math.abs(bp-last)>.00001){try{const w=base.contentWindow,m=w.document.documentElement.scrollHeight-w.innerHeight;w.scrollTo(0,bp*m);last=bp}catch(e){}}}}
requestAnimationFrame(frame);
</script>
<script type="module" src="./city-v20.js?v=22"></script>
</body>
</html>
