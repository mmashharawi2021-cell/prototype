<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent — Earth Atmosphere V17</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}body{height:1000.5vh;touch-action:pan-y}
#stage,#cloudFx,#mist{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none}
#stage{overflow:hidden;background:#020611}#stage canvas,#cloudFx{display:block;width:100%;height:100%}
#cloudFx{z-index:3}#mist{z-index:4;opacity:0;background:radial-gradient(ellipse at 25% 43%,rgba(255,255,255,.72),rgba(218,227,231,.28) 35%,transparent 65%),radial-gradient(ellipse at 78% 58%,rgba(246,249,250,.64),rgba(188,200,205,.25) 42%,transparent 73%);filter:blur(10px);transform:scale(1.08);will-change:opacity}
</style>
</head>
<body><div id="stage"></div><canvas id="cloudFx"></canvas><div id="mist"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const TOTAL=10.005,EARTH_END=2.12,CLOUD_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}const R=rng(17092026);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x020611);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.008,1400);
const renderer=new THREE.WebGLRenderer({antialias:innerWidth>768,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.08:1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8d8e8,0x1e2630,.58));const sun=new THREE.DirectionalLight(0xfff7e8,3.8);sun.position.set(5,3,7);scene.add(sun);const rimLight=new THREE.DirectionalLight(0x6fa8d9,.28);rimLight.position.set(-5,1,-2);scene.add(rimLight);

const starsN=3000,sp=new Float32Array(starsN*3);for(let i=0;i<starsN;i++){const r=70+R()*120,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;sp[i*3]=r*Math.sin(th)*Math.cos(ph);sp[i*3+1]=r*Math.cos(th);sp[i*3+2]=r*Math.sin(th)*Math.sin(ph)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.22,color:0xb9c9dc,transparent:true,opacity:.78}));scene.add(stars);

const earthGroup=new THREE.Group();earthGroup.position.set(0,0,0);scene.add(earthGroup);
const loader=new THREE.TextureLoader(),base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:8,specular:0x1d2c3d,transparent:true});
loader.load(base+'earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.needsUpdate=true});loader.load(base+'earth_normal_2048.jpg',t=>{earthMat.normalMap=t;earthMat.normalScale.set(.42,.42);earthMat.needsUpdate=true});loader.load(base+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),earthMat);earthGroup.add(earth);
const cloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.54,depthWrite:false,color:0xffffff});loader.load(base+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;cloudMat.map=t;cloudMat.needsUpdate=true});const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.008,96,96),cloudMat);earthGroup.add(earthClouds);
earthGroup.rotation.set(.22,-.13,-.035);

const atmoU={uColor:{value:new THREE.Color(0x74b9e6)},uOpacity:{value:.34}};
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.036,96,96),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.0);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform vec3 uColor;uniform float uOpacity;varying vec3 n,v;void main(){float f=pow(clamp(1.0-max(dot(n,v),0.0),0.0,1.0),5.4);float edge=smoothstep(.12,1.0,f);gl_FragColor=vec4(uColor,edge*uOpacity);}`}));earthGroup.add(atmo);
const hazeU={uColor:{value:new THREE.Color(0x9bd4f3)},uOpacity:{value:.095}};
const haze=new THREE.Mesh(new THREE.SphereGeometry(1.015,96,96),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:hazeU,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.0);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform vec3 uColor;uniform float uOpacity;varying vec3 n,v;void main(){float f=pow(1.0-clamp(dot(n,v),0.0,1.0),2.5);gl_FragColor=vec4(uColor,f*uOpacity);}`}));earthGroup.add(haze);

const earthKeys=[[0,3.28,50],[.55,3.20,50],[1.0,2.82,50.5],[1.28,2.25,51.5],[1.52,1.67,54],[1.76,1.28,58],[1.96,1.09,63],[2.12,1.018,68]];
function earthSample(t){for(let i=1;i<earthKeys.length;i++){const a=earthKeys[i-1],b=earthKeys[i];if(t<=b[0]){const q=ease(seg(t,a[0],b[0]));return{z:lerp(a[1],b[1],q),f:lerp(a[2],b[2],q)}}}return{z:1.018,f:68}}

const fx=document.getElementById('cloudFx'),ctx=fx.getContext('2d',{alpha:true}),mist=document.getElementById('mist');let W=0,H=0,DPR=1;
function puffTexture(type){const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');for(let i=0;i<15;i++){const px=n*(.23+R()*.54),py=n*(.23+R()*.54),rr=n*(.12+R()*.22),g=x.createRadialGradient(px,py,0,px,py,rr);if(type===0){g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.5,'rgba(244,248,250,.70)');g.addColorStop(.8,'rgba(207,218,224,.28)')}else{g.addColorStop(0,'rgba(234,240,243,.90)');g.addColorStop(.5,'rgba(199,210,216,.62)');g.addColorStop(.8,'rgba(145,160,168,.26)')}g.addColorStop(1,'rgba(120,140,150,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,Math.PI*2);x.fill()}return c}const puffs=[puffTexture(0),puffTexture(1)];
const clusters=[];for(let i=0;i<30;i++){const parts=[],n=7+Math.floor(R()*8);for(let j=0;j<n;j++)parts.push({x:(R()-.5)*1.05,y:(R()-.5)*.74,s:.42+R()*.72,type:R()>.72?1:0});clusters.push({x:(R()-.5)*2.5,y:(R()-.5)*1.25,z:.10+R()*1.95,size:.34+R()*.50,parts})}for(let i=0;i<12;i++){const side=i%2?1:-1,parts=[];for(let j=0;j<14;j++)parts.push({x:(R()-.5)*.84,y:(R()-.5)*1.10,s:.50+R()*.82,type:R()>.58?1:0});clusters.push({x:side*(.34+R()*.55),y:(R()-.5)*.40,z:.16+i*.15,size:.48+R()*.35,parts})}
function resizeFx(){DPR=Math.min(devicePixelRatio||1,1.2);W=innerWidth;H=innerHeight;fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);fx.style.width=W+'px';fx.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}resizeFx();
function drawClouds(t){ctx.clearRect(0,0,W,H);const q=seg(t,EARTH_END,CLOUD_END);if(q<=0||q>=1.05){fx.style.opacity='0';return}fx.style.opacity=String(seg(t,2.03,2.26)*(1-seg(t,4.72,5.02)));const over=ease(seg(t,2.55,4.12)),mixc=(a,b,m)=>Math.round(lerp(a,b,m));const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,`rgb(${mixc(6,119,over)},${mixc(35,130,over)},${mixc(82,132,over)})`);sky.addColorStop(.53,`rgb(${mixc(92,188,over)},${mixc(167,196,over)},${mixc(217,195,over)})`);sky.addColorStop(1,`rgb(${mixc(170,184,over)},${mixc(205,199,over)},${mixc(225,202,over)})`);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.70*(1-seg(q,.72,.98));for(let i=0;i<20;i++){const x=(i/19)*W+Math.sin(i*2.1)*18,y=H*(.55+.035*Math.sin(i)),s=W*(.115+.032*(i%3));ctx.drawImage(puffs[i%5===0?1:0],x-s*.5,y-s*.25,s,s*.62)}ctx.restore();for(const c of clusters){let z=c.z-q*2.05;while(z<.06)z+=2.05;const inv=1/(.12+z),cx=W*.5+c.x*W*.31*inv,cy=H*.50+c.y*H*.25*inv,bs=c.size*Math.min(W,H)*.72*inv,alpha=clamp((1-z/2.2)*1.3,.16,.94);for(const p of c.parts){const s=bs*p.s;ctx.globalAlpha=alpha*(p.type?.76:.88);ctx.drawImage(puffs[p.type],cx+p.x*bs-s*.5,cy+p.y*bs-s*.5,s,s)}}ctx.globalAlpha=1;const inside=Math.sin(seg(t,2.85,4.45)*Math.PI);if(inside>0){ctx.save();ctx.globalAlpha=.34*inside;const s=Math.max(W,H)*.78;ctx.drawImage(puffs[1],-s*.46,H*.05,s,s);ctx.drawImage(puffs[0],W-s*.54,H*.18,s,s);ctx.restore()}}

let smoothP=0,last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smoothP+=(target-smoothP)*(1-Math.exp(-7.5*dt));const t=smoothP*TOTAL,k=earthSample(Math.min(t,EARTH_END));camera.position.set(0,0,k.z);camera.lookAt(0,0,0);camera.fov=k.f;camera.updateProjectionMatrix();earth.rotation.y+=dt*.006;earthClouds.rotation.y+=dt*.011;const fade=1-ease(seg(t,2.04,2.28));earthGroup.visible=fade>.004;stars.visible=fade>.004;earthMat.opacity=fade;cloudMat.opacity=.54*fade;atmoU.uOpacity.value=.34*fade;hazeU.uOpacity.value=.095*fade;scene.background.set(t>2.02?0x83a4b4:0x020611);renderer.render(scene,camera);drawClouds(t);const inside=seg(t,2.85,3.55)*(1-seg(t,4.18,4.72));mist.style.opacity=(t>2.02&&t<4.82)?String(.05+.54*inside):'0'}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.08:1.6));resizeFx()});
</script></body></html>
