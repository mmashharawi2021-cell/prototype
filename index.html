<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent 3D — City Realism V13</title>
<style>
:root{--mix:0;--grade:0}
*{box-sizing:border-box}
html,body{margin:0;background:#020611;overflow-x:hidden}
html{overscroll-behavior-y:none}
body{height:1000.5vh;touch-action:pan-y}
#baseWrap,#cityWrap,#grade{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none;overflow:hidden}
#base{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
#city{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#city canvas{display:block;width:100%!important;height:100%!important}
#baseWrap{opacity:calc(1 - var(--mix));will-change:opacity}
#cityWrap{opacity:var(--mix);filter:saturate(.79) contrast(.97) brightness(.98);will-change:opacity}
#grade{
 z-index:10;
 background:
  linear-gradient(to bottom,rgba(16,25,28,0),rgba(70,79,74,.035)),
  radial-gradient(circle at 50% 46%,rgba(255,255,255,0) 58%,rgba(23,27,25,.055) 100%);
 opacity:var(--grade);mix-blend-mode:multiply
}
</style>
</head>
<body>
<div id="baseWrap"><iframe id="base" src="./base-v4.html?v=13"></iframe></div>
<div id="cityWrap"><div id="city"></div></div>
<div id="grade"></div>
<script>
const TOTAL=10.005,IN=4.62,FULL=5.20,HOLD=4.62;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t);
const root=document.documentElement,base=document.getElementById('base');
let cityReady=false,baseReady=false,last=-1,target=0;
function prog(){const m=document.documentElement.scrollHeight-innerHeight;return m>0?clamp(scrollY/m):0}
function upd(){target=prog()}
addEventListener('scroll',upd,{passive:true});
addEventListener('resize',upd,{passive:true});
base.addEventListener('load',()=>{baseReady=true;upd()});
addEventListener('atlas-city-ready',()=>{cityReady=true});
addEventListener('atlas-city-lost',()=>{cityReady=false});
upd();
function frame(){
 requestAnimationFrame(frame);
 const p=target,t=p*TOTAL;
 const mix=cityReady?ease(clamp((t-IN)/(FULL-IN))):0;
 root.style.setProperty('--mix',mix.toFixed(4));
 root.style.setProperty('--grade',(cityReady?ease(clamp((t-4.50)/.90)):0).toFixed(4));
 if(baseReady){
   const bt=Math.min(t,HOLD),bp=bt/TOTAL;
   if(Math.abs(bp-last)>.00001){
     try{
       const w=base.contentWindow,m=w.document.documentElement.scrollHeight-w.innerHeight;
       w.scrollTo(0,bp*m);last=bp
     }catch(e){}
   }
 }
}
requestAnimationFrame(frame);
</script>
<script type="module" src="./city-v13.js?v=13"></script>
</body>
</html>
