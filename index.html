<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent 3D — Final Sequence V14</title>
<style>
:root{--mix:0;--grade:0}
*{box-sizing:border-box}
html,body{margin:0;background:#020611;overflow-x:hidden}
html{overscroll-behavior-y:none}
body{height:1000.5vh;touch-action:pan-y}
#baseWrap,#cityWrap,#grade{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none;overflow:hidden}
#base{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
#city{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#city canvas{display:block;width:100%!important;height:100%!important}
#baseWrap{opacity:calc(1 - var(--mix));will-change:opacity}
#cityWrap{opacity:var(--mix);filter:saturate(.80) contrast(.975) brightness(.985);will-change:opacity}
#grade{
 z-index:10;
 background:
  linear-gradient(to bottom,rgba(16,25,28,0),rgba(70,79,74,.03)),
  radial-gradient(circle at 50% 46%,rgba(255,255,255,0) 60%,rgba(23,27,25,.045) 100%);
 opacity:var(--grade);mix-blend-mode:multiply
}
</style>
</head>
<body>
<div id="baseWrap"><iframe id="base" src="./base-v12.html?v=14" title="Earth and cloud sequence"></iframe></div>
<div id="cityWrap"><div id="city"></div></div>
<div id="grade"></div>
<script>
const TOTAL=10.005;
const CITY_PEEK=4.72;
const CLOUD_END=4.82;
const CITY_FULL=5.10;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t*t*(3-2*t);
const root=document.documentElement,base=document.getElementById('base');
let cityReady=false,baseReady=false,last=-1,target=0;

function progress(){
  const m=document.documentElement.scrollHeight-innerHeight;
  return m>0?clamp(scrollY/m):0;
}
function update(){target=progress()}
addEventListener('scroll',update,{passive:true});
addEventListener('resize',update,{passive:true});
base.addEventListener('load',()=>{baseReady=true;update()});
addEventListener('atlas-city-ready',()=>{cityReady=true});
addEventListener('atlas-city-lost',()=>{cityReady=false});
update();

function frame(){
 requestAnimationFrame(frame);
 const p=target,t=p*TOTAL;
 const mix=cityReady?ease(clamp((t-CITY_PEEK)/(CITY_FULL-CITY_PEEK))):0;
 root.style.setProperty('--mix',mix.toFixed(4));
 const grade=cityReady?ease(clamp((t-4.78)/(5.34-4.78))):0;
 root.style.setProperty('--grade',grade.toFixed(4));
 if(baseReady){
   const baseTime=Math.min(t,CLOUD_END);
   const baseP=baseTime/TOTAL;
   if(Math.abs(baseP-last)>.00001){
     try{
       const w=base.contentWindow;
       const m=w.document.documentElement.scrollHeight-w.innerHeight;
       w.scrollTo(0,baseP*m);
       last=baseP;
     }catch(e){}
   }
 }
}
requestAnimationFrame(frame);
</script>
<script type="module" src="./city-v13.js?v=14"></script>
</body>
</html>
