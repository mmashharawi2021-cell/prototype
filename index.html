<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Descent 3D — Comparison Pass V7</title>
<style>
:root{--cityMix:0;--grade:0}
*{box-sizing:border-box}
html,body{margin:0;background:#020611;overflow-x:hidden}
html{overscroll-behavior-y:none}
body{height:1000.5vh;touch-action:pan-y}
#baseWrap,#cityWrap,#grade{position:fixed;inset:0;width:100%;height:100dvh;pointer-events:none;overflow:hidden}
#base{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
#city{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:1!important}
#city canvas{display:block;width:100%!important;height:100%!important}
#baseWrap{opacity:calc(1 - var(--cityMix));filter:saturate(calc(1 - var(--grade)*.08)) contrast(calc(1 - var(--grade)*.025));will-change:opacity,filter}
#cityWrap{opacity:var(--cityMix);filter:saturate(.82) contrast(.98) brightness(.98);will-change:opacity,filter}
#grade{z-index:10;background:linear-gradient(to bottom,rgba(18,27,30,0),rgba(76,84,79,.035)),radial-gradient(circle at 50% 46%,rgba(255,255,255,0) 56%,rgba(20,25,24,.065) 100%);opacity:var(--grade);mix-blend-mode:multiply}
@media(max-width:768px){#cityWrap{filter:saturate(.80) contrast(.98) brightness(.99)}#grade{background:linear-gradient(to bottom,rgba(18,27,30,0),rgba(74,82,77,.025))}}
</style>
</head>
<body>
<div id="baseWrap"><iframe id="base" src="./base-v4.html?v=7" title="Earth and cloud scene"></iframe></div>
<div id="cityWrap"><div id="city"></div></div>
<div id="grade"></div>
<script>
const TOTAL=10.005,CITY_IN=4.62,CITY_FULL=5.20,BASE_HOLD=4.62;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t*t*(3-2*t);
const root=document.documentElement,base=document.getElementById('base'),baseWrap=document.getElementById('baseWrap');
let target=0,lastBase=-1,baseReady=false;
function progress(){const max=document.documentElement.scrollHeight-innerHeight;return max>0?clamp(scrollY/max):0}
function update(){target=progress()}
addEventListener('scroll',update,{passive:true});addEventListener('resize',update,{passive:true});
base.addEventListener('load',()=>{baseReady=true;update()});update();
function frame(){
  requestAnimationFrame(frame);
  const p=target,t=p*TOTAL;
  const mix=ease(clamp((t-CITY_IN)/(CITY_FULL-CITY_IN)));
  const grade=ease(clamp((t-4.46)/(5.32-4.46)));
  root.style.setProperty('--cityMix',mix.toFixed(4));
  root.style.setProperty('--grade',grade.toFixed(4));
  baseWrap.style.visibility=t>5.27?'hidden':'visible';
  if(baseReady){
    const baseTime=Math.min(t,BASE_HOLD),baseP=baseTime/TOTAL;
    if(Math.abs(baseP-lastBase)>.00001){
      try{const w=base.contentWindow,d=w.document.documentElement,max=d.scrollHeight-w.innerHeight;w.scrollTo(0,baseP*max);lastBase=baseP}catch(e){}
    }
  }
}
requestAnimationFrame(frame);
</script>
<script type="module" src="./city-v5.js?v=7"></script>
</body>
</html>
