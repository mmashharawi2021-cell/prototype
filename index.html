<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Atlas Descent 3D — V2</title>
<style>
html,body{margin:0;background:#020611;overflow-x:hidden}
body{height:950vh}
#stage{position:fixed;inset:0;overflow:hidden;background:#020611}
canvas{display:block;width:100%;height:100%}
#badge{position:fixed;top:12px;right:14px;color:#dfe7ef;font:10px/1.2 system-ui;letter-spacing:.16em;opacity:.22;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div><div id="badge">ATLAS DESCENT • V2</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const TOTAL=10.005, EARTH_END=2.12, CLOUDS_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=t=>t*t*(3-2*t);
function rng(seed=1){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260907);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020611);
scene.fog=new THREE.Fog(0x9aa3a5,1000,2000);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.03,1800);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<768?1.35:1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.03;
document.getElementById('stage').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xd8e6f3,0x4e514f,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff9ef,4.4);sun.position.set(7,6,8);scene.add(sun);
const cool=new THREE.DirectionalLight(0x7fa8d5,.55);cool.position.set(-8,3,-4);scene.add(cool);

const spaceGroup=new THREE.Group();scene.add(spaceGroup);
const starN=3600,starPos=new Float32Array(starN*3),starCol=new Float32Array(starN*3);
const cc=new THREE.Color();
for(let i=0;i<starN;i++){
 const r=70+R()*120,th=Math.acos(2*R()-1),ph=R()*Math.PI*2;
 starPos[i*3]=r*Math.sin(th)*Math.cos(ph);starPos[i*3+1]=r*Math.cos(th);starPos[i*3+2]=r*Math.sin(th)*Math.sin(ph);
 cc.setHSL(.57+R()*.08,.18+R()*.25,.55+R()*.35);starCol[i*3]=cc.r;starCol[i*3+1]=cc.g;starCol[i*3+2]=cc.b;
}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(starPos,3));sg.setAttribute('color',new THREE.BufferAttribute(starCol,3));
spaceGroup.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.24,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true})));

function nebulaTexture(){const s=512,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#020611';x.fillRect(0,0,s,s);for(let i=0;i<28;i++){const px=R()*s,py=R()*s,rr=70+R()*170;const g=x.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,`rgba(${20+R()*25|0},${45+R()*45|0},${90+R()*60|0},${.018+R()*.025})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s)}return new THREE.CanvasTexture(c)}
const nebula=new THREE.Sprite(new THREE.SpriteMaterial({map:nebulaTexture(),transparent:true,opacity:.72,depthWrite:false}));nebula.scale.set(140,90,1);nebula.position.set(0,0,-40);spaceGroup.add(nebula);

const earthGroup=new THREE.Group();scene.add(earthGroup);
const loader=new THREE.TextureLoader();
const base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const earthMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:11,specular:0x26394f});
loader.load(base+'earth_atmos_2048.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;earthMat.map=t;earthMat.needsUpdate=true});
loader.load(base+'earth_normal_2048.jpg',t=>{earthMat.normalMap=t;earthMat.normalScale.set(.55,.55);earthMat.needsUpdate=true});
loader.load(base+'earth_specular_2048.jpg',t=>{earthMat.specularMap=t;earthMat.needsUpdate=true});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),earthMat);earthGroup.add(earth);
const cloudMat=new THREE.MeshLambertMaterial({transparent:true,opacity:.53,depthWrite:false,color:0xffffff});
loader.load(base+'earth_clouds_1024.png',t=>{t.colorSpace=THREE.SRGBColorSpace;cloudMat.map=t;cloudMat.needsUpdate=true});
const earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.011,96,96),cloudMat);earthGroup.add(earthClouds);
earthGroup.rotation.set(-.11,-1.84,-.07);

const atmoUniforms={uPower:{value:1.05},uOpacity:{value:.82},uColor:{value:new THREE.Color(0x73b8ff)}};
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.08,96,96),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:atmoUniforms,vertexShader:`varying vec3 n,v;void main(){vec4 w=modelMatrix*vec4(position,1.);n=normalize(mat3(modelMatrix)*normal);v=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uPower,uOpacity;uniform vec3 uColor;varying vec3 n,v;void main(){float rim=pow(1.-max(dot(n,v),0.),3.6);gl_FragColor=vec4(uColor,rim*uOpacity*uPower);}`}));earthGroup.add(atmo);

const cloudWorld=new THREE.Group();scene.add(cloudWorld);
function puffTexture(){const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');for(let i=0;i<12;i++){const px=s*(.28+R()*.44),py=s*(.28+R()*.44),rr=s*(.13+R()*.22);const g=x.createRadialGradient(px,py,0,px,py,rr);g.addColorStop(0,'rgba(255,255,255,.72)');g.addColorStop(.45,'rgba(255,255,255,.26)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,Math.PI*2);x.fill()}return new THREE.CanvasTexture(c)}
const puffTex=puffTexture();
const cloudMats=[
 new THREE.SpriteMaterial({map:puffTex,color:0xf9fbfd,transparent:true,opacity:.0,depthWrite:false}),
 new THREE.SpriteMaterial({map:puffTex,color:0xd9e0e5,transparent:true,opacity:.0,depthWrite:false}),
 new THREE.SpriteMaterial({map:puffTex,color:0xaeb8c0,transparent:true,opacity:.0,depthWrite:false})
];
const cloudSprites=[];
function addCumulus(cx,cy,cz,sx,sy,sz,shade=0){
 const n=8+Math.floor(R()*7);
 for(let i=0;i<n;i++){
  const sp=new THREE.Sprite(cloudMats[clamp(shade+(R()>.72?1:0),0,2)|0]);
  const px=cx+(R()-.5)*sx,py=cy+(R()-.5)*sy,pz=cz+(R()-.5)*sz;
  const ss=(10+R()*18)*(sx/34);sp.position.set(px,py,pz);sp.scale.set(ss*(1.2+R()*.75),ss*(.85+R()*.55),1);cloudWorld.add(sp);cloudSprites.push(sp);
 }
}
for(let i=0;i<44;i++) addCumulus((R()-.5)*300,38+R()*18,-80-R()*260,28+R()*28,14+R()*18,24+R()*36,R()>.65?1:0);
for(let i=0;i<22;i++){
 const side=R()>.5?1:-1;
 addCumulus(side*(30+R()*85),18+R()*80,-10-R()*190,40+R()*40,70+R()*90,38+R()*45,R()>.55?1:0);
}
for(let i=0;i<26;i++) addCumulus((R()-.5)*115,-5+R()*48,30-R()*180,34+R()*26,30+R()*45,30+R()*38,1);

const skyGeo=new THREE.SphereGeometry(600,32,20);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,transparent:true,uniforms:{uMix:{value:0},uOpacity:{value:0}},vertexShader:`varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float uMix,uOpacity;varying float h;void main(){vec3 top=mix(vec3(.018,.09,.22),vec3(.42,.47,.48),uMix);vec3 hor=mix(vec3(.48,.70,.90),vec3(.74,.77,.76),uMix);vec3 bot=mix(vec3(.58,.70,.78),vec3(.53,.56,.55),uMix);vec3 c=h>0.?mix(hor,top,pow(clamp(h,0.,1.),.55)):mix(hor,bot,pow(clamp(-h,0.,1.),.65));gl_FragColor=vec4(c,uOpacity);}`});
const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);

const city=new THREE.Group();scene.add(city);
const concrete=new THREE.MeshStandardMaterial({color:0x777b78,roughness:1});
const concreteDark=new THREE.MeshStandardMaterial({color:0x575c59,roughness:1});
const concreteLight=new THREE.MeshStandardMaterial({color:0x92958f,roughness:1});
const groundMat=new THREE.MeshStandardMaterial({color:0x555b57,roughness:1});
const unitBox=new THREE.BoxGeometry(1,1,1);
function cube(parent,x,y,z,sx,sy,sz,mat=concrete,ry=0,rz=0){const m=new THREE.Mesh(unitBox,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.y=ry;m.rotation.z=rz;parent.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(520,720,1,1),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-210);city.add(ground);
for(const x of [-36,0,38]) cube(city,x,.03,-210,7,.06,700,new THREE.MeshStandardMaterial({color:0x4d524f,roughness:1}),0,0);

function ruinedBuilding(x,z,w,d,floors,damage=0.5){
 const g=new THREE.Group();g.position.set(x,0,z);city.add(g);const fh=4.2,total=floors*fh;
 const colsX=Math.max(2,Math.round(w/5)), colsZ=Math.max(2,Math.round(d/5));
 for(let ix=0;ix<=colsX;ix++)for(let iz=0;iz<=colsZ;iz++){
  if(R()<damage*.12)continue;const h=total*(.55+R()*.45);cube(g,-w/2+ix*(w/colsX),h/2,-d/2+iz*(d/colsZ),.34,h,.34,R()>.5?concrete:concreteDark);
 }
 for(let f=1;f<=floors;f++){
  const y=f*fh;const missing=R()<damage*(.26+f/floors*.28);
  if(!missing){
   const cut=R()<damage*.55;
   if(cut){cube(g,-w*.18,y,-d*.03,w*.58,.22,d*.94,concreteLight,0,(R()-.5)*.035);cube(g,w*.32,y,d*.08,w*.22,.22,d*.72,concrete,0,(R()-.5)*.08)}
   else cube(g,0,y,0,w,.22,d,R()>.72?concreteLight:concrete);
  } else if(R()>.35){cube(g,(R()-.5)*w*.35,y,(R()-.5)*d*.25,w*(.25+R()*.25),.22,d*(.25+R()*.35),concrete,0,(R()-.5)*.16)}
 }
 for(let i=0;i<Math.floor(floors*.9);i++){
  if(R()<.42){const y=(1+i)*fh-1.3;cube(g,-w/2-.05,y,(R()-.5)*d,.18,2.2,2+R()*3,concreteDark,0,(R()-.5)*.12)}
 }
 g.rotation.y=(R()-.5)*.12;
}
const hero=[[-42,35,22,18,8,.6],[33,8,18,16,11,.52],[-8,-20,26,20,7,.72],[52,-48,20,17,9,.63],[-55,-72,18,18,12,.58],[8,-92,23,18,10,.67],[46,-126,16,15,13,.62],[-39,-140,24,18,8,.73],[-2,-168,19,17,11,.55],[57,-194,24,18,7,.78],[-54,-220,21,18,10,.68],[14,-242,27,21,8,.72],[44,-284,17,16,12,.59],[-34,-310,20,19,10,.69]];
hero.forEach(v=>ruinedBuilding(...v));
for(let i=0;i<52;i++){const x=(R()-.5)*230,z=20-R()*390;if(Math.abs(x)<65&&R()<.48)continue;ruinedBuilding(x,z,10+R()*15,10+R()*13,4+Math.floor(R()*9),.28+R()*.42)}

const rubbleGeo=new THREE.TetrahedronGeometry(1,0);const rubbleMat=new THREE.MeshStandardMaterial({color:0x737671,roughness:1});const rubble=new THREE.InstancedMesh(rubbleGeo,rubbleMat,1700);const tm=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
for(let i=0;i<1700;i++){const z=60-R()*430,x=(R()-.5)*180;const rr=.18+R()*1.35;p.set(x,.18+R()*.5,z);q.setFromEuler(new THREE.Euler(R()*Math.PI,R()*Math.PI,R()*Math.PI));s.set(rr*(.4+R()*1.6),rr*(.2+R()*.7),rr*(.4+R()*1.9));tm.compose(p,q,s);rubble.setMatrixAt(i,tm)}city.add(rubble);

function smokeTexture(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(120,125,122,.25)');g.addColorStop(.55,'rgba(95,101,98,.14)');g.addColorStop(1,'rgba(70,75,72,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c)}
const smokeTex=smokeTexture();const smokeSprites=[];
for(let i=0;i<17;i++){const cx=(R()-.5)*180,cz=20-R()*400;for(let j=0;j<5;j++){const sm=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xa5aaa7,transparent:true,opacity:.0,depthWrite:false}));sm.position.set(cx+(R()-.5)*9,7+j*7+R()*5,cz+(R()-.5)*8);const ss=18+j*7+R()*12;sm.scale.set(ss,ss,1);city.add(sm);smokeSprites.push(sm)}}

let smooth=0,last=performance.now();
const look=new THREE.Vector3();
function earthPath(t){const p=seg(t,0,EARTH_END);const e=Math.pow(p,2.22);return{pos:new THREE.Vector3(0,.02,lerp(4.05,1.13,e)),look:new THREE.Vector3(0,.02,0),fov:lerp(49,72,Math.pow(p,4.6))}}
function cloudPath(t){const p=seg(t,EARTH_END,CLOUDS_END),e=smoothstep(p);const y=lerp(95,25,e),z=lerp(125,-58,e),x=lerp(0,5,Math.sin(p*Math.PI)*.6);return{pos:new THREE.Vector3(x,y,z),look:new THREE.Vector3(lerp(0,-2,p),lerp(42,12,e),lerp(-90,-135,e)),fov:lerp(66,58,p)}}
function cityPath(t){const p=seg(t,CLOUDS_END,TOTAL),e=smoothstep(p);const z=lerp(58,-330,e),y=lerp(34,18,e),x=Math.sin(p*Math.PI*2.2)*8 + lerp(0,-3,p);return{pos:new THREE.Vector3(x,y,z),look:new THREE.Vector3(x*.15,lerp(9,8,p),z-70),fov:lerp(59,66,p)}}
function pathAt(t){return t<=EARTH_END?earthPath(t):t<=CLOUDS_END?cloudPath(t):cityPath(t)}

function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;
 const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smooth+=(target-smooth)*(1-Math.exp(-6.8*dt));const t=smooth*TOTAL;const p=pathAt(t);
 camera.position.copy(p.pos);look.lerp(p.look,1-Math.exp(-13*dt));camera.lookAt(look);if(Math.abs(camera.fov-p.fov)>.02){camera.fov=p.fov;camera.updateProjectionMatrix()}
 earth.rotation.y+=dt*.006;earthClouds.rotation.y+=dt*.012;
 const earthFade=1-seg(t,1.88,2.25);earthGroup.visible=earthFade>.01;spaceGroup.visible=earthFade>.01;earthMat.opacity=earthFade;earthMat.transparent=earthFade<.999;cloudMat.opacity=.53*earthFade;atmoUniforms.uOpacity.value=.82*earthFade;atmoUniforms.uPower.value=1+seg(t,1.58,2.1)*1.2;
 const cIn=seg(t,1.88,2.34),cOut=1-seg(t,4.55,5.24),cAlpha=cIn*cOut;cloudWorld.visible=cAlpha>.005;for(const sp of cloudSprites)sp.material.opacity=(sp.material===cloudMats[0]? .72:sp.material===cloudMats[1]?.58:.46)*cAlpha;
 const cityIn=seg(t,4.38,5.12);city.visible=cityIn>.005;for(const sm of smokeSprites)sm.material.opacity=.22*cityIn;
 sky.visible=t>1.82;sky.position.copy(camera.position);skyMat.uniforms.uOpacity.value=seg(t,1.82,2.35);skyMat.uniforms.uMix.value=seg(t,4.2,5.55);
 if(t<EARTH_END-.18){scene.fog.near=900;scene.fog.far=1600;scene.fog.color.set(0x020611)}
 else if(t<CLOUDS_END){const cp=seg(t,EARTH_END,CLOUDS_END),inside=Math.sin(cp*Math.PI);scene.fog.near=lerp(80,5,inside);scene.fog.far=lerp(420,70,inside);scene.fog.color.set(0xc8d2d7).lerp(new THREE.Color(0xa7b1b6),inside)}
 else{const cp=seg(t,CLOUDS_END,TOTAL);scene.fog.near=18;scene.fog.far=lerp(185,145,cp);scene.fog.color.set(0xb0b5b2)}
 hemi.intensity=t<CLOUDS_END?1.0:1.32;sun.intensity=t<CLOUDS_END?4.4:2.6;renderer.toneMappingExposure=t<CLOUDS_END?1.03:.92;
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<768?1.35:1.8))});
</script>
</body></html>
