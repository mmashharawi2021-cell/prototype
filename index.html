<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atlas Descent 3D</title>
<style>
html,body{margin:0;background:#020611;color:#fff;font-family:system-ui,sans-serif}
body{height:900vh;overflow-x:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;opacity:.38;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div><div id="hint">SCROLL</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const TOTAL=10.005, EARTH_END=2.12, CLOUDS_END=4.82;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x020611);
scene.fog=new THREE.Fog(0x8d9cae,1000,100000);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.01,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<768?1.5:2));
renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8fb4ff,0x06101e,.55));
const sun=new THREE.DirectionalLight(0xfff4e6,5.5); sun.position.set(6,2.5,5); scene.add(sun);
const fill=new THREE.DirectionalLight(0x2f5fbf,.25); fill.position.set(-6,-1,-3); scene.add(fill);

const starN=2400, starPos=new Float32Array(starN*3);
for(let i=0;i<starN;i++){const r=90+Math.random()*80,th=Math.acos(2*Math.random()-1),ph=Math.random()*Math.PI*2;starPos[i*3]=r*Math.sin(th)*Math.cos(ph);starPos[i*3+1]=r*Math.cos(th);starPos[i*3+2]=r*Math.sin(th)*Math.sin(ph)}
const starGeo=new THREE.BufferGeometry(); starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:.34,color:0xadc8ff,transparent:true,opacity:.9}));scene.add(stars);

const earthGroup=new THREE.Group(); scene.add(earthGroup);
const earthMat=new THREE.MeshStandardMaterial({color:0x315d8e,roughness:.92,metalness:0});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),earthMat); earth.rotation.z=-.41; earthGroup.add(earth);
const landMat=new THREE.MeshStandardMaterial({color:0x4f664e,roughness:1});
for(let i=0;i<18;i++){
  const g=new THREE.SphereGeometry(.08+Math.random()*.11,10,8,0,Math.PI*2,0,Math.PI*.75);
  const m=new THREE.Mesh(g,landMat);
  const th=Math.acos(2*Math.random()-1),ph=Math.random()*Math.PI*2, rr=1.002;
  m.position.set(rr*Math.sin(th)*Math.cos(ph),rr*Math.cos(th),rr*Math.sin(th)*Math.sin(ph));
  m.lookAt(0,0,0); m.scale.set(1.6,.55,1); earth.add(m);
}
const cloudShell=new THREE.Mesh(new THREE.SphereGeometry(1.012,64,64),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.16,depthWrite:false,roughness:1}));earthGroup.add(cloudShell);
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.07,64,64),new THREE.MeshBasicMaterial({color:0x5b9cff,transparent:true,opacity:.14,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));earthGroup.add(atmo);

const skyGeo=new THREE.SphereGeometry(500,32,16);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,depthWrite:false,uniforms:{uOpacity:{value:0}},vertexShader:`varying float vH;void main(){vH=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float uOpacity;varying float vH;void main(){vec3 top=vec3(.04,.14,.30),h=vec3(.76,.83,.90),b=vec3(.38,.45,.55);vec3 c=vH>0.?mix(h,top,pow(clamp(vH,0.,1.),.6)):mix(h,b,pow(clamp(-vH,0.,1.),.5));gl_FragColor=vec4(c,uOpacity);}`});
const sky=new THREE.Mesh(skyGeo,skyMat); scene.add(sky);

function puffTexture(){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');for(let i=0;i<7;i++){const px=s*(.28+Math.random()*.44),py=s*(.3+Math.random()*.4),r=s*(.18+Math.random()*.22),g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}return new THREE.CanvasTexture(c)}
const puffTex=puffTexture();
const clouds=new THREE.Group();scene.add(clouds);
function cloudZAtY(y){const e=(4-y)/(4+82);return lerp(1.045,-56,e)}
for(let i=0;i<150;i++){
  const y=-2-Math.random()*62,z=cloudZAtY(y)+(Math.random()-.5)*140,x=(Math.random()-.5)*160;
  if(y<-46 && Math.hypot(x,z-cloudZAtY(y))<42) continue;
  const sm=new THREE.SpriteMaterial({map:puffTex,color:y>-35?0xf2f6fb:0x9aa7b7,transparent:true,opacity:.0,depthWrite:false});
  const sp=new THREE.Sprite(sm); const s=16+Math.random()*28;sp.scale.set(s,s,1);sp.position.set(x,y,z);clouds.add(sp);
}

const city=new THREE.Group(); scene.add(city);
const blockMat=new THREE.MeshStandardMaterial({color:0x6e6b66,roughness:1});
for(let i=0;i<60;i++){const w=4+Math.random()*8,h=5+Math.random()*15,d=4+Math.random()*8;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),blockMat);b.position.set((Math.random()-.5)*90,-108+h/2,-80-Math.random()*260);b.rotation.y=(Math.random()-.5)*.3;city.add(b)}

let smooth=0,last=performance.now();
function pathAt(t){
 if(t<=EARTH_END){const p=seg(t,0,EARTH_END),e=Math.pow(p,2.35);return {pos:new THREE.Vector3(0,0,lerp(4.15,1.045,e)),look:new THREE.Vector3(0,0,0),fov:lerp(52,68,Math.pow(p,5))}}
 if(t<=CLOUDS_END){const p=seg(t,EARTH_END,CLOUDS_END),s=p*p*(3-2*p),e=.34*p+.66*s,y=lerp(4,-82,e),z=cloudZAtY(y);return{pos:new THREE.Vector3(0,y,z),look:new THREE.Vector3(0,y-14,z-22),fov:lerp(68,62,p)}}
 const p=seg(t,CLOUDS_END,TOTAL);const y=lerp(-82,-108,Math.min(p*1.6,1)),z=lerp(-56,-330,p);return{pos:new THREE.Vector3(0,y,z),look:new THREE.Vector3(0,y-4,z-40),fov:62}}

function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;const max=document.documentElement.scrollHeight-innerHeight,target=max>0?scrollY/max:0;smooth+=(target-smooth)*(1-Math.exp(-7*dt));const t=smooth*TOTAL;const p=pathAt(t);camera.position.copy(p.pos);camera.lookAt(p.look);camera.fov=p.fov;camera.updateProjectionMatrix();
 earth.rotation.y+=dt*.008;cloudShell.rotation.y+=dt*.012;
 const skyO=seg(t,EARTH_END-.05,EARTH_END+.5);skyMat.uniforms.uOpacity.value=skyO;sky.position.copy(camera.position);
 earthGroup.visible=t<EARTH_END+.6;stars.material.opacity=1-seg(t,EARTH_END-.05,EARTH_END+.75);
 const cf=seg(t,EARTH_END-.12,EARTH_END+.28)*(1-seg(t,CLOUDS_END-.58,CLOUDS_END+.15));for(const sp of clouds.children){sp.material.opacity=.48*cf}
 const y=camera.position.y,inside=clamp(((-6-y)/14),0,1)*(1-clamp(((-64-y)/14),0,1));scene.fog.near=lerp(1000,2,inside*skyO);scene.fog.far=lerp(100000,55,inside*skyO);
 city.visible=t>CLOUDS_END-.2;renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<768?1.5:2))});
</script>
</body></html>
